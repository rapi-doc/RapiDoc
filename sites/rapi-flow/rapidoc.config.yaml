# yaml-language-server: $schema=../../packages/rapidoc-portal/schema.json
# The RapiFlow documentation site (https://flow.rapidocui.com), built with RapiDoc Portal. RapiFlow's feature page
# is on rapidocui.com (/rapi-flow/); this site holds its docs and RapiDoc's Arazzo support.
site:
  title: RapiFlow
  url: https://flow.rapidocui.com
  description: Documentation of RapiFlow, the <rapi-flow> web component that draws Arazzo workflows next to your API reference and runs them in the browser.
  logo:
    src:
      light: /rapi-flow-lockup-light.svg
      dark: /rapi-flow-lockup-dark.svg
    alt: RapiFlow
  favicon: /rapidoc-leaves.svg
# Google Analytics: the same property as rapidocui.com; content_group tells the sites apart.
head:
  - script:
      async: true
      src: https://www.googletagmanager.com/gtag/js?id=G-M9TPKERDJ6
  - script: |
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-M9TPKERDJ6', { content_group: 'Flow' });
theme:
  primary: "#f6a821" # amber, as on rapidocui.com
  mode: auto
  fonts:
    sans: { family: Inter }
    mono: { family: JetBrains Mono }
  css: ./styles/portal.css
# The header every RapiDoc site shares (sites/rapidoc is the source): the Products menu, with absolute
# rapidocui.com links, and the Docs menu (Get started, API Reference, Browse). Keep it the same in sites/rapi-flow, sites/rapi-mock and sites/rapi-portal.
header:
  tabs: sidebar-select # the sections above the docs sidebar, as on rapidocui.com
  links:
    - label: Products
      position: start
      groups:
        - label: Products
          items:
            - label: RapiDoc
              badge: <rapi-doc>
              href: https://rapidocui.com/rapidoc/
              icon: file-code
              description: Interactive API reference from your OpenAPI spec
            - label: RapiDoc Mini
              badge: <rapi-doc-mini>
              href: https://rapidocui.com/rapidoc-mini/
              icon: puzzle-piece
              description: A few endpoints, with Try, inside a post or guide
            - label: RapiFlow
              badge: <rapi-flow>
              href: https://rapidocui.com/rapi-flow/
              icon: path
              description: Step through and run Arazzo workflows
            - label: RapiPdf
              badge: <rapi-pdf>
              href: https://rapidocui.com/rapipdf/
              icon: file-pdf
              description: Turn an OpenAPI spec into a PDF
            - label: RapiMock
              badge: rapidoc mock
              href: https://rapidocui.com/rapi-mock/
              icon: hard-drives
              description: A mock server that validates requests and remembers
            - label: RapiDoc Portal
              href: https://rapidocui.com/portal/
              icon: layout
              description: API references and guides as one site, with search and SSO
        - label: Tools
          items:
            - label: RapiDoc CLI
              badge: rapidoc
              href: https://rapidocui.com/cli/
              icon: terminal
              description: Preview, validate, lint, bundle and export specs
            - label: MCP Server
              href: https://rapidocui.com/docs/mcp/
              icon: robot
              description: Turn your API into tools for AI agents
            - label: Pre-rendering
              href: https://rapidocui.com/docs/prerender/
              icon: lightning
              description: Server-rendered HTML for search engines and a fast first paint
        - label: Integrations
          items:
            - { label: All integrations, href: https://rapidocui.com/integrations/ }
            - { label: "React, Vue, Angular, Svelte", href: https://rapidocui.com/docs/integrations/front-end/ }
            - { label: "Hono, Express, Fastify", href: https://rapidocui.com/docs/integrations/node/ }
            - { label: "Starlight, VitePress, Docusaurus", href: https://rapidocui.com/docs/integrations/docs-sites/ }
            - { label: "Python (FastAPI, Starlette)", href: https://rapidocui.com/docs/integrations/python/ }
            - { label: ".NET (ASP.NET Core)", href: https://rapidocui.com/docs/integrations/dotnet/ }
            - { label: "Go (net/http)", href: https://rapidocui.com/docs/integrations/go/ }
            - { label: Build an integration, href: https://rapidocui.com/docs/integrations/build-your-own/ }
      footer:
        label: Which package do I need?
        href: "https://rapidocui.com/docs/#which-package-do-i-need"
    - label: Docs
      position: start
      groups:
        - label: Get Started
          items:
            - { label: RapiDoc, badge: <rapi-doc>, href: https://rapidocui.com/docs/rapidoc/get-started/quickstart/, icon: file-code }
            - { label: RapiFlow, badge: <rapi-flow>, href: /docs/quickstart/, icon: path }
            - { label: RapiMock, badge: rapidoc mock, href: https://mock.rapidocui.com/docs/getting-started/quickstart/, icon: hard-drives }
            - { label: RapiDoc Portal, href: https://portal.rapidocui.com/docs/getting-started/quickstart/, icon: layout }
            - { label: RapiDoc Mini, badge: <rapi-doc-mini>, href: "https://rapidocui.com/docs/rapidoc-mini/#show-one-endpoint", icon: puzzle-piece }
            - { label: RapiPdf, badge: <rapi-pdf>, href: "https://rapidocui.com/docs/rapipdf/#add-it-to-a-page", icon: file-pdf }
            - { label: RapiDoc CLI, badge: rapidoc, href: https://rapidocui.com/docs/cli/, icon: terminal }
        - label: API Reference
          items:
            - { label: RapiDoc, badge: <rapi-doc>, href: https://rapidocui.com/docs/rapidoc/reference/, icon: file-code }
            - { label: RapiDoc Mini, badge: <rapi-doc-mini>, href: https://rapidocui.com/docs/rapidoc-mini/reference/, icon: puzzle-piece }
            - { label: RapiFlow, badge: <rapi-flow>, href: /docs/reference/, icon: path }
            - { label: RapiPdf, badge: <rapi-pdf>, href: https://rapidocui.com/docs/rapipdf/reference/, icon: file-pdf }
            - { label: RapiDoc CLI, badge: rapidoc, href: https://rapidocui.com/docs/cli/reference/, icon: terminal }
            - { label: RapiMock, badge: rapidoc mock, href: https://mock.rapidocui.com/docs/reference/cli/, icon: hard-drives }
            - { label: RapiDoc Portal, badge: rapidoc.config.yaml, href: https://portal.rapidocui.com/docs/reference/config/, icon: layout }
        - label: Browse
          items:
            - { label: All documentation, href: https://rapidocui.com/docs/, icon: books }
            - { label: Integrations, href: https://rapidocui.com/docs/integrations/, icon: plug }
            - { label: MCP Server, href: https://rapidocui.com/docs/mcp/, icon: robot }
            - { label: Pre-rendering, href: https://rapidocui.com/docs/prerender/, icon: lightning }
            - { label: Examples, href: https://rapidocui.com/examples/, icon: squares-four }
            - { label: Migration guides, href: https://rapidocui.com/docs/rapidoc/migration/v13-to-v14/, icon: arrows-clockwise }
      footer:
        label: Which package do I need?
        href: "https://rapidocui.com/docs/#which-package-do-i-need"
    - label: GitHub
      href: https://github.com/rapi-doc/RapiDoc
      icon: github-logo
      style: button
navigation:
  - label: Documentation
    icon: book
    items:
      - { label: Overview, href: / } # the home page (docs/index.mdx); a slug can't name it
      - { slug: quickstart, label: Quickstart }
      - { slug: reference, label: API Reference }
      - { slug: pairing, label: "Pairing with <rapi-doc>" }
      - { slug: running, label: Running Workflows }
      - { slug: extensions, label: Arazzo Extensions }
      - { slug: styling, label: "Slots & Styling" }
docs:
  editUrl: https://github.com/rapi-doc/RapiDoc/edit/master/sites/rapi-flow/docs/
footer:
  columns:
    - title: Docs
      links:
        - { label: Overview, href: / }
        - { label: Quickstart, href: /docs/quickstart/ }
        - { label: Running Workflows, href: /docs/running/ }
        - { label: Arazzo Extensions, href: /docs/extensions/ }
    - title: RapiFlow
      links:
        - { label: Feature page, href: https://rapidocui.com/rapi-flow/ }
        - { label: API Reference, href: /docs/reference/ }
        - { label: Arazzo Specification, href: https://spec.openapis.org/arazzo/latest.html }
    - title: Project
      links:
        - { label: RapiDoc, href: https://rapidocui.com }
        - { label: GitHub, href: https://github.com/rapi-doc/RapiDoc }
  social:
    - icon: github
      href: https://github.com/rapi-doc/RapiDoc
  copyright: © 2026 RapiDoc. MIT licensed.
