<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d">
<title id="t">Where RapiDoc Mini fits</title>
<desc id="d">One OpenAPI spec feeds the full reference on the docs site, rendered by rapi-doc, and single operations embedded with rapi-doc-mini in a blog post, a tutorial step, a changelog entry and a dashboard.</desc>
<defs>
