<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 764" width="360" height="764" role="img" aria-labelledby="t d">
<title id="t">One spec, the whole lifecycle</title>
<desc id="d">One OpenAPI spec, with an Arazzo file beside it, through six stages: Check with the RapiDoc CLI (validate, lint, bundle); Mock with RapiMock (state, scopes, checks); Document with RapiDoc, RapiDoc Mini and RapiPdf (reference, embed, PDF); Explain with RapiFlow (Arazzo, runnable); Publish with RapiDoc Portal (SSO, search, static); Automate with the MCP Server (tools for AI agents).</desc>
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="rgba(148,163,184,0.10)"/></pattern>
<linearGradient id="panelFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1528"/><stop offset="1" stop-color="#080d1a"/></linearGradient>
