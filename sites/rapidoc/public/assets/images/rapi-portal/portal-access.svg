<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="t d">
<title id="t">Who sees what</title>
<desc id="d">Five requests: a signed-out visitor reads a public page and is sent to sign in for a partner page; a signed-in partner reads it but is denied the billing API; staff in the billing-team group read the billing API. The matching access rule lights up for each.</desc>
