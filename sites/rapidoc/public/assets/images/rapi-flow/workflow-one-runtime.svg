<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
<title id="t">One workflow runtime, three places</title>
<desc id="d">One Arazzo spec feeds RapiFlow's workflow runtime, which runs the workflow in the browser, serves it to AI agents as an MCP tool and draws it in the developer portal.</desc>
