# yaml-language-server: $schema=../../packages/rapidoc-portal/schema.json
# rapidocui.com rebuilt with RapiDoc Portal (see AGENTS.md). The live site is still built from docs/.
site:
  title: RapiDoc
  url: https://rapidocui.com
  description: A web component for viewing OpenAPI 3.0, 3.1 and Swagger specifications, with an interactive console.
  favicon: /favicon.svg
  logo:
    src:
      light: /assets/images/rapidoc-lockup-light.svg
      dark: /assets/images/rapidoc-lockup-dark.svg
    alt: RapiDoc
    badge: v14.2 # the release step must keep this current (see AGENTS.md)
  noindex: true # until this build replaces the live site
theme:
  mode: dark # the theme a first-time visitor gets; the header's switcher changes it
  primary: "#f6a821"
  fonts:
    sans: { family: Inter }
    mono: { family: JetBrains Mono }
  css: ./styles/portal.css
header:
  tabs: sidebar # the product switcher above the docs sidebar
  links:
    - label: Products
      position: start
      groups:
        - label: Web Components
          items:
            - label: RapiDoc
              badge: <rapi-doc>
              href: /docs/
              icon: file-code
              description: Interactive API reference from your OpenAPI spec
            - label: RapiDoc Mini
              badge: <rapi-doc-mini>
              href: /rapidoc-mini/
              icon: puzzle-piece
              description: A few endpoints, with Try, inside a post or guide
            - label: RapiFlow
              badge: <rapi-flow>
              href: /rapi-flow/
              icon: path
              description: Step through and run Arazzo workflows
            - label: RapiPdf
              badge: <rapi-pdf>
              href: /rapipdf/
              icon: file-pdf
              description: Turn an OpenAPI spec into a PDF
        - label: Tools
          items:
            - label: Developer Portal
              href: https://portal.rapidocui.com/
              icon: layout
              description: API references and guides as one site, with search and SSO
            - label: RapiDoc CLI
              badge: rapidoc
              href: /cli/
              icon: terminal
              description: Preview, validate, lint, bundle and export specs
            - label: Mock Server
              href: /docs/mocking/overview/
              icon: hard-drives
              description: Answer requests from your spec, in the page or as a server
            - label: MCP Server
              href: /docs/ai/mcp-server/
              icon: robot
              description: Turn your API into tools for AI agents
            - label: Pre-rendering
              href: /docs/performance/prerender/
              icon: lightning
              description: Server-rendered HTML for search engines and a fast first paint
        - label: Integrations
          items:
            - { label: All integrations, href: /integrations/ }
            - { label: "React, Vue, Angular, Svelte", href: /docs/integrations/front-end/ }
            - { label: "Hono, Express, Fastify", href: /docs/integrations/node/ }
            - { label: "Starlight, VitePress, Docusaurus", href: /docs/integrations/docs-sites/ }
            - { label: "Python (FastAPI, Starlette)", href: /docs/integrations/python/ }
            - { label: ".NET (ASP.NET Core)", href: /docs/integrations/dotnet/ }
            - { label: "Go (net/http)", href: /docs/integrations/go/ }
            - { label: Build an integration, href: /docs/integrations/build-your-own/ }
      footer:
        label: Which package do I need?
        href: /docs/get-started/packages/
    - { label: Quickstart, href: /docs/get-started/quickstart/, position: start }
    - { label: Docs, href: /docs, position: start }
    - { label: API, href: /api, position: start }
    - { label: Examples, href: /examples, position: start }
    - label: GitHub
      href: https://github.com/rapi-doc/RapiDoc
      icon: github-logo
      style: button
# The docs pages have no footer; the site's own pages draw theirs (components/SiteFooter.astro).
footer: false
# One tab per product, as the product switcher of the live site's docs sidebar
navigation:
  - label: "RapiDoc"
    icon: file-code
    items:
      - label: "Getting Started"
        items:
          - { slug: index, label: "Introduction" }
          - { slug: get-started/quickstart, label: "Quickstart" }
          - { slug: guides, label: "Common Tasks" }
          - { slug: get-started/packages, label: "Packages" }
          - { slug: get-started/openapi-support, label: "Loading Your Spec" }
      - label: "Theming & Styling"
        items:
          - { slug: theming/overview, label: "Theming Overview" }
          - { slug: theming/prebuilt-themes, label: "Built-in Themes" }
          - { slug: theming/css-parts, label: "CSS Parts & Variables" }
      - label: "Customizing Content"
        items:
          - { slug: customizing/slots, label: "HTML Slots" }
          - { slug: customizing/markdown-headings, label: "Markdown Headings in the Sidebar" }
          - { slug: customizing/linking, label: "Links & Navigation" }
      - label: "Authentication"
        items:
          - { slug: authentication/oauth, label: "OAuth 2.0" }
      - label: "JavaScript API"
        items:
          - { slug: programmatic-api/lifecycle-and-methods, label: "Methods" }
          - { slug: programmatic-api/event-hooks, label: "Events" }
      - label: "Performance"
        items:
          - { slug: performance/render-modes, label: "Render Modes" }
          - { slug: performance/large-specs, label: "Large Specs" }
          - { slug: performance/prerender, label: "Pre-rendering" }
      - label: "Mocking"
        items:
          - { slug: mocking/overview, label: "Overview" }
          - { slug: mocking/in-browser, label: "In-Browser Mock" }
          - { slug: mocking/mock-server, label: "Mock Server" }
      - label: "AI & MCP"
        items:
          - { slug: ai/mcp-server, label: "MCP Server" }
      - label: "Reference"
        items:
          - { label: "API Reference", href: /api/ }
          - { label: "Examples", href: /examples/ }
      - label: "Migration Guides"
        collapsed: true
        items:
          - { slug: migration/v13-to-v14, label: "v13 to v14" }
          - { slug: migration/v12-to-v13, label: "v12 to v13" }
          - { slug: migration/v11-to-v12, label: "v11 to v12" }
          - { slug: migration/v10-to-v11, label: "v10 to v11" }
  - label: "RapiDoc Mini"
    icon: puzzle-piece
    items:
      - { slug: rapidoc-mini, label: "Overview" }
      - { label: "API Reference", href: /api/rapi-doc-mini/ }
      - { label: "Live Demos", href: /rapidoc-mini/ }
  - label: "RapiFlow"
    icon: path
    items:
      - { slug: rapi-flow, label: "Overview" }
      - { slug: rapi-flow/pairing, label: "Pairing with <rapi-doc>" }
      - { slug: rapi-flow/running, label: "Running Workflows" }
      - { slug: rapi-flow/extensions, label: "Arazzo Extensions" }
      - { slug: rapi-flow/styling, label: "Slots & Styling" }
      - { label: "API Reference", href: /api/rapi-flow/ }
      - { label: "Live Demo", href: /rapi-flow/ }
  - label: "RapiPdf"
    icon: file-pdf
    items:
      - { slug: rapipdf, label: "Overview" }
      - { slug: rapipdf/node, label: "In Node" }
      - { label: "API Reference", href: /api/rapi-pdf/ }
      - { label: "Live Demo", href: /rapipdf/ }
  - label: "RapiDoc CLI"
    icon: terminal
    items:
      - { slug: cli, label: "Overview" }
      - label: "Commands"
        items:
          - { slug: cli/preview, label: "preview" }
          - { slug: cli/validate, label: "validate" }
          - { slug: cli/lint, label: "lint" }
          - { slug: cli/bundle, label: "bundle" }
          - { slug: cli/pdf, label: "pdf" }
          - { slug: cli/mock, label: "mock" }
          - { slug: cli/mcp, label: "mcp" }
      - { slug: cli/reference, label: "All Commands & Options" }
      - { label: "Portal Commands", href: https://portal.rapidocui.com/docs/reference/cli/ }
  - label: "Integrations"
    icon: plug
    items:
      - { slug: integrations, label: "Overview" }
      - { slug: integrations/front-end, label: "Front-End Frameworks" }
      - label: "Server Frameworks"
        items:
          - { slug: integrations/node, label: "Hono, Express & Fastify" }
          - { slug: integrations/python, label: "FastAPI & Starlette" }
          - { slug: integrations/dotnet, label: "ASP.NET Core" }
          - { slug: integrations/go, label: "Go" }
      - { slug: integrations/docs-sites, label: "Documentation Sites" }
      - { slug: integrations/build-your-own, label: "Build an Integration" }
  - label: Developer Portal
    icon: layout
    href: https://portal.rapidocui.com/
