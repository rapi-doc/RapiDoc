# yaml-language-server: $schema=../../packages/rapidoc-portal/schema.json
# rapidocui.com rebuilt with RapiDoc Portal (see AGENTS.md). The live site is still built from docs/.
site:
  title: RapiDoc
  url: https://rapidocui.com
  description: A web component for viewing OpenAPI 3.0, 3.1 and Swagger specifications, with an interactive console.
  favicon: /favicon.svg
  logo:
    src:
      light: /assets/images/rapidoc-lockup-light.svg
      dark: /assets/images/rapidoc-lockup-dark.svg
    alt: RapiDoc
    badge: v14.2 # RapiDoc's version; scripts/sync-version.mjs keeps it current, don't edit it
  noindex: true # until this build replaces the live site
# Google Analytics on the docs pages, as the live site sends it: the page title as "Docs / <title>" and the
# content group "Docs". The site's own pages (home, /api, examples) send theirs from their own layout
# (components/GoogleAnalytics.astro), so this must stay the same property.
head:
  - script:
      async: true
      src: https://www.googletagmanager.com/gtag/js?id=G-M9TPKERDJ6
  - script: |
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      (function() {
        var segs = window.location.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
        var docTitle = (document.title || '').replace(/\s*\|\s*RapiDoc$/i, '').trim();
        if (!docTitle && segs.length > 0) {
          docTitle = segs[segs.length - 1].split('-').map(function(w){ return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ');
        }
        gtag('config', 'G-M9TPKERDJ6', {
          page_title: docTitle ? 'Docs / ' + docTitle : 'Docs',
          content_group: 'Docs',
        });
      })();
theme:
  mode: dark # the theme a first-time visitor gets; the header's switcher changes it
  primary: "#f6a821"
  fonts:
    sans: { family: Inter }
    mono: { family: JetBrains Mono }
  css: ./styles/portal.css
header:
  tabs: sidebar # the product switcher above the docs sidebar
  links:
    - label: Products
      position: start
      groups:
        - label: Products
          items:
            - label: RapiDoc
              badge: <rapi-doc>
              href: /rapidoc/
              icon: file-code
              description: Interactive API reference from your OpenAPI spec
            - label: RapiDoc Mini
              badge: <rapi-doc-mini>
              href: /rapidoc-mini/
              icon: puzzle-piece
              description: A few endpoints, with Try, inside a post or guide
            - label: RapiFlow
              badge: <rapi-flow>
              href: /rapi-flow/
              icon: path
              description: Step through and run Arazzo workflows
            - label: RapiPdf
              badge: <rapi-pdf>
              href: /rapipdf/
              icon: file-pdf
              description: Turn an OpenAPI spec into a PDF
            - label: RapiMock
              badge: rapidoc mock
              href: /rapi-mock/
              icon: hard-drives
              description: A mock server that validates requests and remembers
            - label: RapiDoc Portal
              href: /portal/
              icon: layout
              description: API references and guides as one site, with search and SSO
        - label: Tools
          items:
            - label: RapiDoc CLI
              badge: rapidoc
              href: /cli/
              icon: terminal
              description: Preview, validate, lint, bundle and export specs
            - label: MCP Server
              href: /docs/mcp/
              icon: robot
              description: Turn your API into tools for AI agents
            - label: Pre-rendering
              href: /docs/prerender/
              icon: lightning
              description: Server-rendered HTML for search engines and a fast first paint
        - label: Integrations
          items:
            - { label: All integrations, href: /integrations/ }
            - { label: "React, Vue, Angular, Svelte", href: /docs/integrations/front-end/ }
            - { label: "Hono, Express, Fastify", href: /docs/integrations/node/ }
            - { label: "Starlight, VitePress, Docusaurus", href: /docs/integrations/docs-sites/ }
            - { label: "Python (FastAPI, Starlette)", href: /docs/integrations/python/ }
            - { label: ".NET (ASP.NET Core)", href: /docs/integrations/dotnet/ }
            - { label: "Go (net/http)", href: /docs/integrations/go/ }
            - { label: Build an integration, href: /docs/integrations/build-your-own/ }
      footer:
        label: Which package do I need?
        href: "/docs/#which-package-do-i-need"
    - { label: Quickstart, href: /docs/rapidoc/get-started/quickstart/, position: start }
    - { label: Docs, href: /docs, position: start }
    - { label: API, href: /api, position: start }
    - { label: Examples, href: /examples, position: start }
    - label: GitHub
      href: https://github.com/rapi-doc/RapiDoc
      icon: github-logo
      style: button
# The docs pages have no footer; the site's own pages draw theirs (components/SiteFooter.astro).
footer: false
