# yaml-language-server: $schema=../../packages/rapidoc-portal/schema.json
# The RapiDoc Portal product and documentation site (https://portal.rapidocui.com), built with RapiDoc Portal.
site:
  title: RapiDoc Portal
  url: https://portal.rapidocui.com
  description: Turn OpenAPI specs and Markdown guides into a developer portal. Docs as code, static output, optional single sign-on (SSO).
  logo:
    src:
      light: /rapidoc-lockup-light.svg
      dark: /rapidoc-lockup-dark.svg
    text: Portal
  favicon: /rapidoc-leaves.svg
  banner:
    message: RapiDoc Portal 1.0 is here, in sync with RapiDoc 15.
    href: /docs/getting-started/whats-new/
    background: "#f6a821"
    color: "#1c1917"
# Google Analytics: the same property as rapidocui.com; content_group tells the sites apart.
head:
  - script:
      async: true
      src: https://www.googletagmanager.com/gtag/js?id=G-M9TPKERDJ6
  - script: |
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-M9TPKERDJ6', { content_group: 'Portal' });
theme:
  primary: "#f6a821" # amber, the API reference's `rapidoc.theme` below
  mode: auto
  fonts: # from Google Fonts, so the site looks the same on every OS
    sans: { family: Inter }
    mono: { family: JetBrains Mono }
  css: ./styles/portal.css # amber surfaces, as in the API reference
# The header every RapiDoc site shares (sites/rapidoc is the source): the Products menu, with absolute
# rapidocui.com links, and the Docs menu (Get started, API Reference, Browse). Keep it the same in sites/rapi-flow, sites/rapi-mock and sites/rapi-portal.
header:
  tabs: sidebar # two tabs (Documentation, Example API), both listed above the sidebar; the dropdown is for sites with many
  links:
    - label: Products
      position: start
      groups:
        - label: Products
          items:
            - label: RapiDoc
              badge: <rapi-doc>
              href: https://rapidocui.com/rapidoc/
              icon: file-code
              description: Interactive API reference from your OpenAPI spec
            - label: RapiDoc Mini
              badge: <rapi-doc-mini>
              href: https://rapidocui.com/rapidoc-mini/
              icon: puzzle-piece
              description: A few endpoints, with Try, inside a post or guide
            - label: RapiFlow
              badge: <rapi-flow>
              href: https://rapidocui.com/rapi-flow/
              icon: path
              description: Step through and run Arazzo workflows
            - label: RapiPdf
              badge: <rapi-pdf>
              href: https://rapidocui.com/rapipdf/
              icon: file-pdf
              description: Turn an OpenAPI spec into a PDF
            - label: RapiMock
              badge: rapidoc mock
              href: https://rapidocui.com/rapi-mock/
              icon: hard-drives
              description: A mock server that validates requests and remembers
            - label: RapiDoc Portal
              href: https://rapidocui.com/portal/
              icon: layout
              description: API references and guides as one site, with search and SSO
        - label: Tools
          items:
            - label: RapiDoc CLI
              badge: rapidoc
              href: https://rapidocui.com/cli/
              icon: terminal
              description: Preview, validate, lint, bundle and export OpenAPI specs
            - label: MCP Server
              href: https://rapidocui.com/docs/mcp/
              icon: robot
              description: Turn your API into tools for AI agents
            - label: Pre-rendering
              href: https://rapidocui.com/docs/prerender/
              icon: lightning
              description: Server-rendered HTML for search engines and a fast first paint
        - label: Integrations
          items:
            - { label: All integrations, href: https://rapidocui.com/integrations/ }
            - { label: "React, Vue, Angular, Svelte", href: https://rapidocui.com/docs/integrations/front-end/ }
            - { label: "Hono, Express, Fastify", href: https://rapidocui.com/docs/integrations/node/ }
            - { label: "Starlight, VitePress, Docusaurus", href: https://rapidocui.com/docs/integrations/docs-sites/ }
            - { label: "Python (FastAPI, Starlette)", href: https://rapidocui.com/docs/integrations/python/ }
            - { label: ".NET (ASP.NET Core)", href: https://rapidocui.com/docs/integrations/dotnet/ }
            - { label: "Go (net/http)", href: https://rapidocui.com/docs/integrations/go/ }
            - { label: Build an integration, href: https://rapidocui.com/docs/integrations/build-your-own/ }
      footer:
        label: Which package do I need?
        href: "https://rapidocui.com/docs/#which-package-do-i-need"
    - { label: Docs, href: "https://rapidocui.com/docs/", position: start } # every product's docs: the cards of rapidocui.com/docs
    - label: GitHub
      href: https://github.com/rapi-doc/RapiDoc
      icon: github-logo
      style: button
navigation:
  - label: Documentation
    icon: book
    items:
      - label: Get started
        icon: rocket-launch
        items:
          - { slug: getting-started/introduction }
          - { slug: getting-started/whats-new, badge: New }
          - { slug: getting-started/upgrading-to-1-0 }
          - { slug: getting-started/quickstart }
          - { slug: getting-started/project-structure }
      - label: Reference
        icon: list-bullets
        items:
          - { slug: reference/cli }
          - { slug: reference/config }
          - { slug: reference/programmatic-api }
          - { slug: reference/how-it-works }
      - label: Configuration
        icon: sliders-horizontal
        items:
          - { slug: configuration/overview }
          - { slug: configuration/customizing }
          - { slug: configuration/site }
          - { slug: configuration/theme }
          - { slug: configuration/header }
          - { slug: configuration/navigation }
          - { slug: configuration/apis }
          - { slug: configuration/workflows }
          - { slug: configuration/footer }
          - { slug: configuration/docs-search-redirects }
          - { slug: configuration/llms }
      - label: Writing guides
        icon: pencil-simple-line
        items:
          - { slug: writing/markdown }
          - { slug: writing/markdoc }
          - { slug: writing/mdx }
          - { slug: writing/callouts }
          - { slug: writing/embedding-operations }
          - { slug: writing/pages }
      - label: API reference pages
        icon: code
        items:
          - { slug: api-reference/reference-pages }
          - { slug: api-reference/versions }
          - { slug: api-reference/catalog }
          - { slug: api-reference/rapidoc-attributes }
      - label: Authentication
        icon: lock
        items:
          - { slug: access/overview, label: Single sign-on (SSO) }
          - { slug: access/setup }
          - { slug: access/entra-id }
          - { slug: access/providers }
          - { slug: access/access-rules }
          - { slug: access/try-it }
      - label: Tools
        icon: wrench
        items:
          - { slug: tools/mock-server }
          - { slug: tools/mcp-server }
          - { slug: tools/spec-checks }
          - { slug: tools/migrate }
      - label: Deploy
        icon: cloud-arrow-up
        items:
          - { slug: deploy/static-hosting }
          - { slug: deploy/rapidoc-serve }
          - { slug: deploy/cloud-platforms }
  - label: Example API
    icon: code
    api: bookstore
  - label: Live demos # example portals on demo.rapidocui.com: Bookstore (the default look), Cosmo Cargo, Rapid Parcels (sign-in)
    icon: monitor-play
    href: https://demo.rapidocui.com/
apis:
  - id: bookstore
    spec: ./specs/bookstore.yaml
    category: Examples
workflows:
  - file: ./workflows/bookstore.arazzo.yaml
docs:
  editUrl: https://github.com/rapi-doc/RapiDoc/edit/master/sites/rapi-portal/docs/
redirects:
  - { from: /docs/getting-started/how-it-works, to: /docs/reference/how-it-works }
# The footer of every RapiDoc site: the same columns in sites/rapidoc, rapi-flow, rapi-mock and rapi-portal.
# Links to this site's own pages are relative (an absolute link would open a new tab).
footer:
  columns:
    - title: Products
      links:
        - { label: RapiDoc, href: https://rapidocui.com/rapidoc/ }
        - { label: RapiDoc Mini, href: https://rapidocui.com/rapidoc-mini/ }
        - { label: RapiFlow, href: https://rapidocui.com/rapi-flow/ }
        - { label: RapiPdf, href: https://rapidocui.com/rapipdf/ }
        - { label: RapiMock, href: https://rapidocui.com/rapi-mock/ }
        - { label: RapiDoc Portal, href: https://rapidocui.com/portal/ }
        - { label: RapiDoc CLI, href: https://rapidocui.com/cli/ }
    - title: Docs
      links:
        - { label: All documentation, href: https://rapidocui.com/docs/ }
        - { label: RapiDoc, href: https://rapidocui.com/docs/rapidoc/ }
        - { label: RapiFlow, href: https://flow.rapidocui.com/ }
        - { label: RapiMock, href: https://mock.rapidocui.com/docs/getting-started/introduction/ }
        - { label: RapiDoc Portal, href: /docs/getting-started/introduction/ }
        - { label: Integrations, href: https://rapidocui.com/integrations/ }
        - { label: MCP Server, href: https://rapidocui.com/docs/mcp/ }
    - title: Resources
      links:
        - { label: Examples, href: https://rapidocui.com/examples/ }
        - { label: Spec Sandbox, href: https://rapidocui.com/sandbox/ }
        - { label: Live Configurator, href: https://rapidocui.com/examples/controller-showcase/ }
        - { label: Migration guides, href: https://rapidocui.com/docs/rapidoc/migration/v13-to-v14/ }
        - { label: Test Matrix, href: https://rapidocui.com/tests/ }
        - { label: Performance, href: https://rapidocui.com/tests/performance/ }
    - title: Project
      links:
        - { label: GitHub, href: https://github.com/rapi-doc/RapiDoc }
        - { label: Releases, href: https://github.com/rapi-doc/RapiDoc/releases }
        - { label: Issues, href: https://github.com/rapi-doc/RapiDoc/issues }
        - { label: npm, href: https://www.npmjs.com/package/rapidoc }
        - { label: Hosting by Simafri, href: https://www.simafri.com/en/managed-vps/ }
  social:
    - icon: github
      href: https://github.com/rapi-doc/RapiDoc
  copyright: © 2026 Mrinmoy Majumdar. MIT licensed.
  branding: false # RapiDoc's own sites: no "Powered by RapiDoc"
rapidoc:
  theme: amber
  render-style: read
  schema-style: tree

llms:
  # The introduction of /llms.txt: this site, then the whole family, so AI agents find the other sites
  description: >-
    Turn OpenAPI specs and Markdown guides into a developer portal. Docs as code, static output, optional single sign-on (SSO). Part of the RapiDoc family of open-source (MIT) tools for OpenAPI and Arazzo, each with its own llms.txt: RapiDoc, the <rapi-doc> web component for interactive API references with Try, an in-browser mock and MCP server export (https://rapidocui.com/llms.txt); RapiDoc Portal, a docs-as-code developer portal built from OpenAPI specs and Markdown guides, with single sign-on and access rules (https://portal.rapidocui.com/llms.txt); RapiMock, a stateful mock server with request validation and token checks (https://mock.rapidocui.com/llms.txt); RapiFlow, the <rapi-flow> web component that draws Arazzo workflows and runs them in the browser (https://flow.rapidocui.com/llms.txt); plus RapiDoc Mini, RapiPdf (OpenAPI to PDF), the RapiDoc CLI (lint, validate, bundle, mock, MCP) and RapiDoc for Express, Fastify, Hono, FastAPI, Starlight, VitePress, Docusaurus and ASP.NET Core.
