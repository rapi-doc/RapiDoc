# yaml-language-server: $schema=../../packages/rapidoc-portal/schema.json
# The RapiDoc Portal product and documentation site (https://portal.rapidocui.com), built with RapiDoc Portal.
site:
  title: RapiDoc Portal
  url: https://portal.rapidocui.com
  description: Turn OpenAPI specs and Markdown guides into a developer portal. Docs as code, static output, optional single sign-on (SSO).
  logo:
    src:
      light: /rapidoc-lockup-light.svg
      dark: /rapidoc-lockup-dark.svg
    text: Portal
  favicon: /rapidoc-leaves.svg
# Google Analytics: the same property as rapidocui.com; content_group tells the sites apart.
head:
  - script:
      async: true
      src: https://www.googletagmanager.com/gtag/js?id=G-M9TPKERDJ6
  - script: |
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-M9TPKERDJ6', { content_group: 'Portal' });
theme:
  primary: "#f6a821" # amber, the API reference's `rapidoc.theme` below
  mode: auto
  fonts: # from Google Fonts, so the site looks the same on every OS
    sans: { family: Inter }
    mono: { family: JetBrains Mono }
  css: ./styles/portal.css # amber surfaces, as in the API reference
# The header every RapiDoc site shares (sites/rapidoc is the source): the Products menu, with absolute
# rapidocui.com links, the Get started menu, and Docs. Keep it the same in sites/rapi-flow, sites/rapi-mock and sites/rapi-portal.
header:
  links:
    - label: Products
      position: start
      groups:
        - label: Products
          items:
            - label: RapiDoc
              badge: <rapi-doc>
              href: https://rapidocui.com/rapidoc/
              icon: file-code
              description: Interactive API reference from your OpenAPI spec
            - label: RapiDoc Mini
              badge: <rapi-doc-mini>
              href: https://rapidocui.com/rapidoc-mini/
              icon: puzzle-piece
              description: A few endpoints, with Try, inside a post or guide
            - label: RapiFlow
              badge: <rapi-flow>
              href: https://rapidocui.com/rapi-flow/
              icon: path
              description: Step through and run Arazzo workflows
            - label: RapiPdf
              badge: <rapi-pdf>
              href: https://rapidocui.com/rapipdf/
              icon: file-pdf
              description: Turn an OpenAPI spec into a PDF
            - label: RapiMock
              badge: rapidoc mock
              href: https://rapidocui.com/rapi-mock/
              icon: hard-drives
              description: A mock server that validates requests and remembers
            - label: RapiDoc Portal
              href: https://rapidocui.com/portal/
              icon: layout
              description: API references and guides as one site, with search and SSO
        - label: Tools
          items:
            - label: RapiDoc CLI
              badge: rapidoc
              href: https://rapidocui.com/cli/
              icon: terminal
              description: Preview, validate, lint, bundle and export specs
            - label: MCP Server
              href: https://rapidocui.com/docs/mcp/
              icon: robot
              description: Turn your API into tools for AI agents
            - label: Pre-rendering
              href: https://rapidocui.com/docs/prerender/
              icon: lightning
              description: Server-rendered HTML for search engines and a fast first paint
        - label: Integrations
          items:
            - { label: All integrations, href: https://rapidocui.com/integrations/ }
            - { label: "React, Vue, Angular, Svelte", href: https://rapidocui.com/docs/integrations/front-end/ }
            - { label: "Hono, Express, Fastify", href: https://rapidocui.com/docs/integrations/node/ }
            - { label: "Starlight, VitePress, Docusaurus", href: https://rapidocui.com/docs/integrations/docs-sites/ }
            - { label: "Python (FastAPI, Starlette)", href: https://rapidocui.com/docs/integrations/python/ }
            - { label: ".NET (ASP.NET Core)", href: https://rapidocui.com/docs/integrations/dotnet/ }
            - { label: "Go (net/http)", href: https://rapidocui.com/docs/integrations/go/ }
            - { label: Build an integration, href: https://rapidocui.com/docs/integrations/build-your-own/ }
      footer:
        label: Which package do I need?
        href: "https://rapidocui.com/docs/#which-package-do-i-need"
    - label: Get started
      position: start
      groups:
        - label: Quickstarts
          items:
            - label: RapiDoc
              badge: <rapi-doc>
              href: https://rapidocui.com/docs/rapidoc/get-started/quickstart/
              icon: file-code
              description: An API reference from your spec, in one HTML file
            - label: RapiFlow
              badge: <rapi-flow>
              href: https://flow.rapidocui.com/docs/quickstart/
              icon: path
              description: Run an Arazzo workflow against the in-browser mock
            - label: RapiMock
              badge: rapidoc mock
              href: https://mock.rapidocui.com/docs/getting-started/quickstart/
              icon: hard-drives
              description: A mock server that keeps what you send
            - label: RapiDoc Portal
              href: /docs/getting-started/quickstart/
              icon: layout
              description: A developer portal on localhost with npm create rapidoc
        - label: In One Step
          items:
            - label: RapiDoc Mini
              badge: <rapi-doc-mini>
              href: https://rapidocui.com/docs/rapidoc-mini/#show-one-endpoint
              icon: puzzle-piece
              description: One endpoint, with Try, inside a post or guide
            - label: RapiPdf
              badge: <rapi-pdf>
              href: https://rapidocui.com/docs/rapipdf/#add-it-to-a-page
              icon: file-pdf
              description: A button that makes a PDF of your spec
            - label: RapiDoc CLI
              badge: rapidoc
              href: https://rapidocui.com/docs/cli/
              icon: terminal
              description: Preview, validate and lint a spec from the command line
      footer:
        label: Which package do I need?
        href: "https://rapidocui.com/docs/#which-package-do-i-need"
    - { label: Docs, href: https://rapidocui.com/docs/, position: start }
    - label: GitHub
      href: https://github.com/rapi-doc/RapiDoc
      icon: github-logo
      style: button
navigation:
  - label: Documentation
    icon: book
    items:
      - label: Get started
        icon: rocket-launch
        items:
          - { slug: getting-started/introduction }
          - { slug: getting-started/quickstart }
          - { slug: getting-started/project-structure }
      - label: Configuration
        icon: sliders-horizontal
        items:
          - { slug: configuration/overview }
          - { slug: configuration/customizing }
          - { slug: configuration/site }
          - { slug: configuration/theme }
          - { slug: configuration/header }
          - { slug: configuration/navigation }
          - { slug: configuration/apis }
          - { slug: configuration/workflows }
          - { slug: configuration/footer }
          - { slug: configuration/docs-search-redirects }
          - { slug: configuration/llms }
      - label: Writing guides
        icon: pencil-simple-line
        items:
          - { slug: writing/markdown }
          - { slug: writing/markdoc }
          - { slug: writing/mdx }
          - { slug: writing/callouts }
          - { slug: writing/embedding-operations }
          - { slug: writing/pages }
      - label: API reference
        icon: code
        items:
          - { slug: api-reference/reference-pages }
          - { slug: api-reference/versions }
          - { slug: api-reference/catalog }
          - { slug: api-reference/rapidoc-attributes }
      - label: Authentication
        icon: lock
        items:
          - { slug: access/overview, label: Single sign-on (SSO) }
          - { slug: access/setup }
          - { slug: access/entra-id }
          - { slug: access/providers }
          - { slug: access/access-rules }
          - { slug: access/try-it }
      - label: Tools
        icon: wrench
        items:
          - { slug: tools/mock-server }
          - { slug: tools/mcp-server }
          - { slug: tools/spec-checks }
          - { slug: tools/migrate }
      - label: Deploy
        icon: cloud-arrow-up
        items:
          - { slug: deploy/static-hosting }
          - { slug: deploy/rapidoc-serve }
          - { slug: deploy/cloud-platforms }
  - label: Reference
    icon: list-bullets
    items:
      - { slug: reference/cli }
      - { slug: reference/config }
      - { slug: reference/programmatic-api }
      - { slug: reference/how-it-works }
  - label: Example API
    icon: code
    api: bookstore
apis:
  - id: bookstore
    spec: ./specs/bookstore.yaml
    category: Examples
workflows:
  - file: ./workflows/bookstore.arazzo.yaml
docs:
  editUrl: https://github.com/rapi-doc/RapiDoc/edit/master/sites/rapi-portal/docs/
redirects:
  - { from: /docs/getting-started/how-it-works, to: /docs/reference/how-it-works }
footer:
  columns:
    - title: Get started
      links:
        - label: Introduction
          href: /docs/getting-started/introduction
        - label: Quickstart
          href: /docs/getting-started/quickstart
        - label: Configuration
          href: /docs/configuration/overview
    - title: Reference
      links:
        - label: CLI
          href: /docs/reference/cli
        - label: Configuration keys
          href: /docs/reference/config
        - label: Programmatic API
          href: /docs/reference/programmatic-api
    - title: Project
      links:
        - label: RapiDoc
          href: https://rapidocui.com
        - label: GitHub
          href: https://github.com/rapi-doc/RapiDoc
  social:
    - icon: github
      href: https://github.com/rapi-doc/RapiDoc
  copyright: © 2026 RapiDoc. MIT licensed.
rapidoc:
  theme: amber
  render-style: read
  schema-style: tree
