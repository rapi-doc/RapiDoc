name: Publish the rapidocui.com preview

# Builds sites/rapidoc (rapidocui.com rebuilt with RapiDoc Portal) with this repository's own CLI and portal, and
# pushes the built files to the main branch of rapi-doc/rapidoc-site-preview, which GitHub Pages serves at
# https://preview.rapidocui.com: a preview to compare with the live site, which is still built from docs/ by
# deploy-docs.yml. That repository holds only the published files; the source is here. The same shape as
# publish-portal-site.yml and publish-mock-site.yml.
#
# The site is served from the root of its own subdomain, not from a path of github.io: its pages link to
# /docs/..., /assets/... and /specs/... from the root. Search engines keep out of the preview: site.noindex in
# sites/rapidoc/rapidoc.config.yaml makes robots.txt disallow everything and puts a noindex tag on the docs pages,
# and the site's own pages name rapidocui.com as their canonical address.
#
# Needs the secret RAPIDOC_SITE_PREVIEW_DEPLOY_KEY: the private half of a deploy key with write access on
# rapi-doc/rapidoc-site-preview.

on:
  push:
    branches:
      - master
      # where the site is being built, until it is merged
      - portal-pages-and-rapidoc-site
    paths:
      - 'sites/rapidoc/**'
      # what the site is built from
      - 'packages/rapidoc-cli/**'
      - 'packages/rapidoc-portal/**'
      - 'packages/rapidoc-prerender/**'
      - 'packages/rapidoc-mcp/**'
      - 'packages/rapidoc/src/**'
      - 'packages/rapipdf/src/**'
      - 'scripts/rapidoc-api.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish-rapidoc-site-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; a newer push replaces one that is waiting, never one that is pushing
concurrency:
  group: publish-rapidoc-site-preview
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    # forks have no deploy key
    if: github.repository == 'rapi-doc/RapiDoc'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build:rapidoc-site

      - name: Check the build
        working-directory: sites/rapidoc/dist
        run: |
          test -f index.html
          test -f docs/index.html
          test -f docs/get-started/quickstart/index.html
          test -f api/index.html
          test -f examples/auth/index.html
          test -f sandbox/index.html
          test -f assets/rapidoc-min.js
          # a preview must not be indexed
          grep -qx 'Disallow: /' robots.txt
          grep -q 'name="robots" content="noindex' docs/index.html

      - name: Push to rapi-doc/rapidoc-site-preview
        working-directory: sites/rapidoc/dist
        env:
          DEPLOY_KEY: ${{ secrets.RAPIDOC_SITE_PREVIEW_DEPLOY_KEY }}
        run: |
          # Pages would otherwise run Jekyll, which drops folders that start with an underscore (_rapidoc)
          touch .nojekyll
          # The preview's address. Written here, not in sites/rapidoc/public: the site's own address is rapidocui.com.
          echo "preview.rapidocui.com" > CNAME
          cat > README.md <<TEXT
          # rapidoc-site-preview

          A preview of https://rapidocui.com rebuilt with RapiDoc Portal, at https://preview.rapidocui.com.

          Do not edit these files: every publish replaces this branch. The source is
          [sites/rapidoc](https://github.com/rapi-doc/RapiDoc/tree/${GITHUB_REF_NAME}/sites/rapidoc) in the RapiDoc
          repository, built and pushed by its workflow "Publish the rapidocui.com preview".
          TEXT

          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          # The branch holds the site as it is now and nothing else: one commit, replaced by every publish
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish the rapidocui.com preview from rapi-doc/RapiDoc@${GITHUB_SHA::7}"
          git push -q --force git@github.com:rapi-doc/rapidoc-site-preview.git main
          rm -f "$RUNNER_TEMP/deploy_key"
