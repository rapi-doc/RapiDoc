name: Deploy rapidocui.com to GitHub Pages

# Builds sites/rapidoc (rapidocui.com, built with RapiDoc Portal from this repository's own CLI and portal) and
# deploys it with GitHub Pages; the custom domain rapidocui.com is set in the repository's Pages settings.
# Until the switch-over (2026-11-22) the live site was the Starlight site in docs/, since removed. The other RapiDoc sites have their own workflows: publish-flow-site.yml,
# publish-mock-site.yml and publish-portal-site.yml.

on:
  push:
    branches:
      - master
    paths:
      - 'sites/rapidoc/**'
      - 'sites/shared/**'
      # what the site is built from
      - 'packages/rapidoc-cli/**'
      - 'packages/rapidoc-portal/**'
      - 'packages/rapidoc-prerender/**'
      - 'packages/rapidoc-mcp/**'
      - 'packages/rapidoc/src/**'
      # its version is the badge next to the site's logo
      - 'packages/rapidoc/package.json'
      - 'packages/rapipdf/src/**'
      - 'scripts/rapidoc-api.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Build rapidocui.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Builds rapidoc, @rapidoc/mcp, @rapidoc/prerender and rapipdf, which the pages load, then the site
      - name: Build the site
        run: npm run build:rapidoc-site

      - name: Check the build
        run: |
          test -f sites/rapidoc/dist/index.html
          test -f sites/rapidoc/dist/docs/index.html
          test -f sites/rapidoc/dist/assets/rapidoc-min.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'sites/rapidoc/dist'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
