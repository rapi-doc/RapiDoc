parts:
  - category: 'Navigation Sidebar'
    description: 'Parts for customizing the sidebar navigation panel, filter inputs, and route links.'
    items:
      - name: 'section-navbar'
        target: '<nav>'
        description: 'Outer navigation sidebar container.'
      - name: 'btn-navbar'
        target: '<button>'
        description: 'Mobile hamburger toggle button to open or collapse the navigation sidebar.'
      - name: 'section-navbar-search'
        target: '<div>'
        description: 'Container wrapping the filter search input inside the navigation sidebar.'
      - name: 'textbox-nav-filter'
        target: '<input>'
        description: 'Text input element used for real-time search filtering in the sidebar.'
      - name: 'btn-clear-filter'
        target: '<button>'
        description: 'Clear button inside the sidebar search input.'
      - name: 'section-navbar-scroll'
        target: '<div>'
        description: 'Scrollable inner container holding all tags, endpoints, and markdown headings.'
      - name: 'section-navbar-item'
        target: '<div>'
        description: 'Base part applied to every clickable item in the navigation sidebar.'
      - name: 'section-navbar-overview'
        target: '<div>'
        description: 'Sidebar item pointing to the API Overview section.'
      - name: 'section-navbar-servers'
        target: '<div>'
        description: 'Sidebar item pointing to the API Servers section.'
      - name: 'section-navbar-auth'
        target: '<div>'
        description: 'Sidebar item pointing to the Authentication section.'
      - name: 'section-navbar-operations-top'
        target: '<div>'
        description: 'Sidebar item pointing to the top of the operations list.'
      - name: 'section-navbar-tag'
        target: '<div>'
        description: 'Sidebar item representing an OpenAPI tag heading.'
      - name: 'section-navbar-path'
        target: '<div>'
        description: 'Sidebar item representing an individual endpoint operation (e.g., GET /users).'

  - category: 'Header & Branding'
    description: 'Parts for the top utility header, logo slot, and dynamic spec loader.'
    items:
      - name: 'section-header'
        target: '<header>'
        description: 'Top utility header bar container.'
      - name: 'section-logo'
        target: '<slot>'
        description: 'Slot container for the brand logo or icon.'
      - name: 'label-header-title'
        target: '<div>'
        description: 'Title text displayed in the header bar.'
      - name: 'textbox-spec-url'
        target: '<input>'
        description: 'Input field for entering an OpenAPI specification URL dynamically.'
      - name: 'textbox-header-filter'
        target: '<input>'
        description: 'Search filter input in the header bar.'

  - category: 'Main Canvas & Overview'
    description: 'Parts for the primary document canvas, spec title, and info anchors.'
    items:
      - name: 'section-main-content'
        target: '<main>'
        description: 'The primary scrollable document canvas wrapper.'
      - name: 'section-overview'
        target: '<div>'
        description: 'Top introductory overview section containing API metadata, description, and contact info.'
      - name: 'section-overview-title'
        target: '<div>'
        description: 'The main API title heading inside the overview section.'
      - name: 'anchor-overview'
        target: '<a>'
        description: 'Contact email, license, and terms of service links in the overview.'

  - category: 'Servers & Environments'
    description: 'Parts for server environment controls, selection, and URL variable templates.'
    items:
      - name: 'section-servers'
        target: '<div>'
        description: 'Container for server selection and environment controls.'
      - name: 'section-servers-title'
        target: '<div>'
        description: 'Title heading for the API Servers section.'
      - name: 'label-selected-server'
        target: '<div>'
        description: 'Label displaying the currently selected base server URL.'
      - name: 'textbox-server-var'
        target: '<input>'
        description: 'Input fields for server URL template variables.'

  - category: 'Authentication & Security'
    description: 'Parts for authentication credentials, OAuth2 scopes, and security modals.'
    items:
      - name: 'section-auth'
        target: '<div>'
        description: 'Container for authentication credentials and security scheme panels.'
      - name: 'section-auth-scopes'
        target: '<div>'
        description: 'Wrapper for OAuth2 authorization scope options.'
      - name: 'checkbox-auth-scope'
        target: "<input type='checkbox'>"
        description: 'Checkbox for selecting individual OAuth2 permission scopes.'
      - name: 'textbox-auth-client-id'
        target: '<input>'
        description: 'Input field for the OAuth2 client ID.'
      - name: 'textbox-auth-client-secret'
        target: '<input>'
        description: 'Input field for the OAuth2 client secret.'
      - name: 'textbox-username'
        target: '<input>'
        description: 'Username input field for HTTP Basic or password authentication.'
      - name: 'textbox-password'
        target: '<input>'
        description: 'Password input field for HTTP Basic or password authentication.'

  - category: 'Operations & Endpoints'
    description: 'Parts for endpoint headers, method badges, paths, summaries, and dividers.'
    items:
      - name: 'section-tag'
        target: '<section>'
        description: 'Tag group container grouping multiple related operations.'
      - name: 'section-tag-title'
        target: '<div>'
        description: 'Header title displayed for an OpenAPI tag.'
      - name: 'label-tag-title'
        target: '<div>'
        description: 'Text label for the tag title.'
      - name: 'section-operations-in-tag'
        target: '<section>'
        description: 'Container wrapping all operations belonging to a tag.'
      - name: 'section-operation'
        target: '<article>'
        description: 'Single endpoint operation container.'
      - name: 'section-operation-summary'
        target: '<h2>'
        description: 'Summary heading for the operation.'
      - name: 'label-operation-method'
        target: '<span>'
        description: 'HTTP method label badge (e.g., GET, POST, PUT, DELETE).'
      - name: 'label-operation-path'
        target: '<span>'
        description: 'Endpoint URI route path.'
      - name: 'endpoint-badge'
        target: '<span>'
        description: 'Status badge on endpoint (e.g., deprecated, webhook).'
      - name: 'operation-divider'
        target: '<div>'
        description: 'Horizontal divider separating operations in read mode.'
      - name: 'section-endpoint-head-expanded'
        target: '<div>'
        description: 'Header row of an expanded endpoint in view or focused mode.'
      - name: 'section-endpoint-head-collapsed'
        target: '<div>'
        description: 'Header row of a collapsed endpoint in view mode.'
      - name: 'section-endpoint-head-method'
        target: '<div>'
        description: 'HTTP method badge in the endpoint header row.'
      - name: 'section-endpoint-head-path'
        target: '<div>'
        description: 'Path text in the endpoint header row.'
      - name: 'section-endpoint-head-description'
        target: '<div>'
        description: 'Short summary description in the endpoint header row.'
      - name: 'section-endpoint-body-expanded'
        target: '<div>'
        description: 'Full body container of an expanded endpoint.'
      - name: 'section-endpoint-body-collapsed'
        target: '<div>'
        description: 'Body container when an endpoint is collapsed.'
      - name: 'section-endpoint-body-title'
        target: '<div>'
        description: 'Summary title inside the expanded endpoint body.'
      - name: 'section-endpoint-body-description'
        target: '<div>'
        description: 'Full markdown description inside the expanded endpoint body.'

  - category: 'Interactive Console & Buttons'
    description: 'Parts for the Try console, buttons, response panels, and action triggers.'
    items:
      - name: 'wrap-request-btn'
        target: '<div>'
        description: 'Container wrapping the Try, Clear, and Execute action buttons.'
      - name: 'btn'
        target: '<button>'
        description: 'Base part applied to all buttons across RapiDoc.'
      - name: 'btn-try'
        target: '<button>'
        description: "The primary 'TRY' execution button."
      - name: 'btn-fill'
        target: '<button>'
        description: 'Solid filled buttons (e.g., primary actions, search, copy).'
      - name: 'btn-outline'
        target: '<button>'
        description: 'Outlined secondary buttons.'
      - name: 'btn-clear'
        target: '<button>'
        description: 'Button to clear request parameter fields.'
      - name: 'btn-clear-response'
        target: '<button>'
        description: 'Button to clear returned response data.'
      - name: 'btn-copy'
        target: '<button>'
        description: 'Copy-to-clipboard button on code blocks and responses.'
      - name: 'btn-search'
        target: '<button>'
        description: 'Search submit button in filter dialogues and headers.'
      - name: 'btn-response-status'
        target: '<button>'
        description: 'HTTP response status code selector buttons (e.g., 200, 400, 404).'
      - name: 'btn-selected-response-status'
        target: '<button>'
        description: 'The currently active HTTP response status button.'

  - category: 'Tabs & Code Panels'
    description: 'Parts for switching between Request/Response tabs, Example/Schema, and languages.'
    items:
      - name: 'tab-panel'
        target: '<div>'
        description: 'Container panel wrapping tab controls and content.'
      - name: 'tab-btn-row'
        target: '<div>'
        description: 'Row of tab selector buttons.'
      - name: 'tab-btn'
        target: '<button>'
        description: 'Individual tab button.'
      - name: 'tab-content'
        target: '<div>'
        description: 'Body container of the active tab.'

  - category: 'Inputs & Form Fields'
    description: 'Parts for parameter inputs, textareas, file pickers, and checkboxes.'
    items:
      - name: 'textbox'
        target: '<input>'
        description: 'Standard text input field.'
      - name: 'textbox-param'
        target: '<input>'
        description: 'Input field for query, path, and header parameters.'
      - name: 'textarea'
        target: '<textarea>'
        description: 'Standard multi-line text input field.'
      - name: 'textarea-param'
        target: '<textarea>'
        description: 'Multi-line text input for request bodies and payload parameters.'
      - name: 'file-input'
        target: "<input type='file'>"
        description: 'File upload input element for multipart forms.'
      - name: 'checkbox'
        target: "<input type='checkbox'>"
        description: 'Standard checkbox input.'
      - name: 'anchor'
        target: '<a>'
        description: 'General links throughout the documentation.'
      - name: 'anchor-param-example'
        target: '<a>'
        description: 'Link to populate an example value into parameter inputs.'
      - name: 'anchor-param-constraint'
        target: '<a>'
        description: 'Link displaying schema constraints (minimum, maximum, pattern, enum).'

  - category: 'Schema & Data Types'
    description: 'Parts for schema descriptions, tree toolbars, and badges.'
    items:
      - name: 'schema-description'
        target: '<span>'
        description: 'Markdown description text inside schema definitions.'
      - name: 'schema-toolbar-item'
        target: '<div>'
        description: 'Controls on schema cards (expand, collapse, view options).'
      - name: 'schema-multiline-toggle'
        target: '<div>'
        description: 'Toggle button to expand or collapse multi-line descriptions.'

variables:
  - category: 'Layout & Geometry'
    description: 'Structural sizing, corner radiuses, scrollbars, and modal behavior.'
    items:
      - name: '--radius'
        default: '0.25rem (4px)'
        description: 'Global component corner radius derived from radius attribute (none, sm, md, lg, full).'
      - name: '--card-radius'
        default: '4px'
        description: 'Compact corner radius for dialog boxes, code blocks, tables, and parameter sections (caps at 6px when radius="full").'
      - name: '--border-radius'
        default: 'var(--radius)'
        description: 'Legacy alias for corner radius.'
      - name: '--layout'
        default: 'row'
        description: 'Flex direction layout of documentation columns.'
      - name: '--scroll-bar-width'
        default: '8px'
        description: 'Width and height of the custom scrollbars.'
      - name: '--nav-item-padding'
        default: '7px 16px 7px 10px'
        description: 'Padding around navigation items in the sidebar (responsive to nav-item-spacing).'
      - name: '--resp-area-height'
        default: '400px / auto'
        description: 'Height of the response console preview area.'
      - name: '--focus-shadow'
        default: '0 0 0 1px transparent, 0 0 0 2px color-mix(in srgb, var(--ring) 40%, transparent)'
        description: 'Outline shadow applied to active interactive elements on keyboard focus.'
      - name: '--table-schema-key-width'
        default: '240px'
        description: 'Minimum column width for property keys in schema tables.'

  - category: 'Typography & Scaling'
    description: 'Font families and font size scaling presets.'
    items:
      - name: '--font-mono'
        default: 'Monaco, "Andale Mono", "Roboto Mono", Consolas, monospace'
        description: 'Font family for code snippets, HTTP methods, paths, and schema types.'
      - name: '--font-regular'
        default: '"Open Sans", Avenir, "Segoe UI", Arial, sans-serif'
        description: 'Font family for headings, body descriptions, and navigation.'
      - name: '--font-size-small'
        default: '12px (default) / 13px (large) / 14px (largest)'
        description: 'Small font size for parameter tables, badges, and metadata labels.'
      - name: '--font-size-mono'
        default: '13px (default) / 14px (large) / 15px (largest)'
        description: 'Base font size for monospace code blocks and syntax highlighter.'
      - name: '--font-size-regular'
        default: '14px (default) / 15px (large) / 16px (largest)'
        description: 'Primary body font size for paragraphs and descriptions.'

  - category: 'Surface & Semantic Colors'
    description: 'Modern semantic design tokens for canvas, cards, text, and muted surfaces.'
    items:
      - name: '--background'
        default: 'theme dependent (#09090b / #ffffff)'
        description: 'Primary canvas and main container background color.'
      - name: '--foreground'
        default: 'theme dependent (#fafafa / #09090b)'
        description: 'Primary foreground body text color.'
      - name: '--card'
        default: 'theme dependent (#18181b / #f4f4f5)'
        description: 'Surface background color for cards, request/response panels, and dialogs.'
      - name: '--card-foreground'
        default: 'theme dependent (#fafafa / #09090b)'
        description: 'Foreground text color inside cards, request panels, and dialogs.'
      - name: '--muted'
        default: 'theme dependent (#27272a / #f4f4f5)'
        description: 'Muted surface background for inactive tabs, hovered rows, and code blocks.'
      - name: '--muted-foreground'
        default: 'theme dependent (#a1a1aa / #71717a)'
        description: 'Secondary muted text color for subtitles, parameter hints, and metadata.'
      - name: '--selection-bg'
        default: 'color-mix(in srgb, var(--primary) 25%, transparent)'
        description: 'Highlight background color for user-selected text.'
      - name: '--selection-fg'
        default: 'var(--foreground)'
        description: 'Text color inside user selections.'

  - category: 'Borders & Sizing Tokens'
    description: 'Dividers, line separators, inputs, and border radius tokens.'
    items:
      - name: '--border'
        default: 'theme dependent (#27272a / #e4e4e7)'
        description: 'Standard border color for dividers, tables, and cards.'
      - name: '--input-background'
        default: 'theme dependent (lighter than background in dark, darker in light)'
        description: 'Background color for text and file inputs, textareas, and code blocks.'
      - name: '--input-border'
        default: 'theme dependent (between border and background)'
        description: 'Border color for text and file inputs, textareas, and code blocks.'
      - name: '--input'
        default: 'var(--input-background)'
        description: 'Alias for --input-background.'
      - name: '--radius'
        default: '0.25rem (responsive to radius attribute)'
        description: 'Border radius token for cards, inputs, buttons, and badges.'

  - category: 'Brand & Accent Colors'
    description: 'Primary brand highlights, button fills, focus rings, and method indicators.'
    items:
      - name: '--primary'
        default: 'preset dependent (#f59e0b amber, #3b82f6 default)'
        description: 'Primary accent color for interactive actions, active navigation items, and buttons.'
      - name: '--primary-foreground'
        default: 'preset dependent (#000000 / #ffffff)'
        description: 'High-contrast text color when placed on top of --primary.'
      - name: '--ring'
        default: 'preset dependent (matches --primary)'
        description: 'Focus ring outline color on interactive elements.'
      - name: '--method-get'
        default: '#3b82f6'
        description: 'HTTP GET method badge color in navigation and endpoint headers.'
      - name: '--method-post'
        default: '#10b981'
        description: 'HTTP POST method badge color in navigation and endpoint headers.'
      - name: '--method-put'
        default: '#f59e0b'
        description: 'HTTP PUT method badge color in navigation and endpoint headers.'
      - name: '--method-delete'
        default: '#ef4444'
        description: 'HTTP DELETE method badge color in navigation and endpoint headers.'
      - name: '--method-patch'
        default: '#8b5cf6'
        description: 'HTTP PATCH method badge color in navigation and endpoint headers.'
      - name: '--method-head'
        default: '#eab308'
        description: 'HTTP HEAD method badge color in navigation and endpoint headers.'
      - name: '--method-options'
        default: '#06b6d4'
        description: 'HTTP OPTIONS method badge color in navigation and endpoint headers.'

  - category: 'Code & Syntax Highlighting'
    description: 'Code blocks, inline tags, and syntax tokens.'
    items:
      - name: '--code-bg'
        default: 'theme dependent'
        description: 'Background color for multi-line code sample panels.'
      - name: '--code-fg'
        default: 'theme dependent'
        description: 'Default text color inside code blocks.'
      - name: '--inline-code-fg'
        default: 'theme dependent'
        description: 'Color for inline `code` tags within descriptions.'
      - name: '--code-property-color'
        default: 'theme dependent'
        description: 'Syntax color for JSON/YAML object keys and properties.'
      - name: '--code-keyword-color'
        default: 'theme dependent'
        description: 'Syntax color for language keywords (import, function, if).'
      - name: '--code-operator-color'
        default: 'theme dependent'
        description: 'Syntax color for syntax operators and punctuation.'
      - name: '--syntax-comment'
        default: 'theme dependent'
        description: 'Token color for code comments.'
      - name: '--syntax-keyword'
        default: 'theme dependent'
        description: 'Token color for syntax keywords.'
      - name: '--syntax-operator'
        default: 'theme dependent'
        description: 'Token color for language operators.'
      - name: '--syntax-string'
        default: 'theme dependent'
        description: 'Token color for string literals.'
      - name: '--syntax-constant'
        default: 'theme dependent'
        description: 'Token color for numeric constants and booleans.'
      - name: '--syntax-function'
        default: 'theme dependent'
        description: 'Token color for function and method identifiers.'
      - name: '--syntax-type'
        default: 'theme dependent'
        description: 'Token color for data type identifiers.'
      - name: '--syntax-variable'
        default: 'theme dependent'
        description: 'Token color for variable names.'
      - name: '--syntax-property'
        default: 'theme dependent'
        description: 'Token color for object property keys.'

slots:
  - name: '(default)'
    placement: 'Below header, above Overview section'
    description: 'Un-slotted child elements placed directly inside <rapi-doc>. Renders at the top of the main canvas. Ideal for system status alerts, migration warnings, or welcome banners.'
  - name: 'fixed-header'
    placement: 'Fixed at the very top of document viewport'
    description: 'Contents that remain permanently pinned at the top and do not scroll out of view.'
  - name: 'logo'
    placement: 'Top utility header (left)'
    description: 'Replaces the default RapiDoc brand logo with your custom company logo image, SVG, or interactive home link.'
  - name: 'header'
    placement: 'Top utility header (right)'
    description: 'Renders custom HTML or buttons after the spec URL input bar. Ideal for GitHub links, external documentation, or environment selectors.'
  - name: 'footer'
    placement: 'Bottom of document canvas'
    description: 'Appends custom markup at the very end of the documentation. Ideal for corporate copyright notices, terms of service, and support contacts.'
  - name: 'nav-logo'
    placement: 'Top of sidebar navigation'
    description: 'Custom branding image or wordmark placed at the top of the sticky sidebar (available in read render-style).'
  - name: 'auth'
    placement: 'Inside Authentication / Security modal'
    description: 'Displays custom guidance, API key generation instructions, or company SSO login buttons inside the auth dialog.'
  - name: 'overview'
    placement: 'Inside Overview summary panel'
    description: 'Custom HTML injected inside the API overview card directly underneath the document title and description.'
  - name: 'servers'
    placement: 'Inside Server configuration card'
    description: 'Custom HTML injected inside the server selector panel. Ideal for environment advisories or uptime links.'
  - name: 'operations-top'
    placement: 'Directly above operations list'
    description: 'Global notices, common request headers, or standard query parameter rules applicable across all API calls.'
  - name: 'tag--{tag-name}'
    placement: 'Underneath specific tag section'
    description: 'Custom HTML injected below a tag group header. Format as tag--{name} (e.g. slot="tag--Pet").'
  - name: '{method}-{path}'
    placement: 'Inside specific operation card'
    description: 'Custom HTML injected into a single endpoint section. Format as {method}-{path} with hyphens (e.g. slot="get-/pet/-petId-").'
