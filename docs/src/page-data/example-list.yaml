examples:
  - Open API Example:
      description: Interactive showcase demonstrating how RapiDoc renders a OpenAPI 3.1 and 3.2 specifications.
      category: Layouts & Views
      img: /assets/images/dog.png
      subExamples:
        - Pet Store (3.1):
            href: /examples/petstore
        - Book Store (3.2):
            href: /examples/bookstore

  - Themes and Colors:
      img: ./assets/images/theme.png
      href: /examples/themes
      description: Match your corporate brand by customizing primary accents, headers, backgrounds, and text colors.
      category: Theming & Branding

  - CSS Styling:
      img: ./assets/images/theme.png
      description: Customize using CSS variables and CSS Shadow Parts for deep layout and style control.
      category: Theming & Branding
      subExamples:
        - Dark Mode:
            href: /examples/css-dark
        - Light Mode:
            href: /examples/css-light

  - Rendering Modes:
      description: Choose between 3 distinct presentation styles to best fit your audience.
      category: Layouts & Views
      subExamples:
        - Read:
            href: /examples/render-read
        - View:
            href: /examples/render-view
        - Focused:
            href: /examples/render-focused

  - Built In Console:
      img: /assets/images/terminal.png
      href: /examples/try
      description: Call and test live API endpoints directly within the documentation, with support for negative and edge-case testing.
      category: Console & Interactive

  - Schema Styles:
      img: /assets/images/schema-style.png
      href: /examples/schema-styles
      description: 'Inspect data models using Tree or Tabular representations, and toggle between Schema and Example views.'
      category: Layouts & Views

  - Navigation Styles:
      img: /assets/images/navbar.png
      href: /examples/nav-styles
      description: Customize navigation sidebar styles, item spacing, active indicators, and endpoint grouping.
      category: Layouts & Views

  - Slots - HTML Injection:
      img: /assets/images/slot.png
      href: /examples/slots
      description: Inject custom HTML content, warning banners, company logos, and navigation links into Shadow DOM slots.
      category: Advanced & Extensibility

  - Markdown:
      img: /assets/images/markdown.png
      href: /examples/markdown
      description: Rich Markdown rendering inside API descriptions, including tables, formatted lists, and callout blocks.
      category: Layouts & Views

  - Markdown Headings in Navigation:
      href: /examples/markdown-headings
      description: Automatically convert Markdown headers inside descriptions into interactive navigation links.
      category: Layouts & Views

  - Links:
      img: /assets/images/link.png
      href: /examples/links
      description: Create deep cross-references and external links between operations, schemas, and external documentation.
      category: Advanced & Extensibility

  - Arrange by OpenAPI Tags:
      href: /examples/arrange-by-tags
      description: Use OpenAPI `tags` array to define and order endpoint groups in the navigation sidebar.
      category: Layouts & Views

  - Endpoint Badges:
      img: /assets/images/badge.png
      href: /examples/badges
      description: Annotate operations with custom color-coded status badges (Beta, Deprecated, Internal) using x-badges.
      category: Layouts & Views

  - Syntax Highlighting:
      img: /assets/images/code-highlight.png
      href: /examples/code-highlight
      description: Built-in syntax highlighting for cURL, JavaScript, Python, Go, and 20+ programming languages.
      category: Console & Interactive

  - Code Samples:
      href: /examples/code-samples
      description: Display multi-language code snippets on operations using the OpenAPI x-code-samples vendor extension.
      category: Console & Interactive

  - Add Your Examples:
      href: /examples/examples-multiple
      description: Provide multiple request and response payload examples to illustrate edge cases and error scenarios.
      category: OpenAPI 3.1 & Schemas

  - File Upload:
      href: /examples/file-upload
      description: Interactive testing for endpoints accepting binary files, document uploads, and streaming data.
      category: Console & Interactive

  - Binary Response:
      href: /examples/binary-response
      description: Handle and download binary responses such as PDF documents, image assets, and archive files.
      category: Console & Interactive

  - Multipart Formdata:
      href: /examples/multipart-formdata
      description: Submit mixed content combining binary files with structured JSON fields using multipart/form-data.
      category: Console & Interactive

  - Multiple Request Body:
      href: /examples/request-body-multiple
      description: Document endpoints supporting alternate payload formats such as JSON, XML, or plain text.
      category: OpenAPI 3.1 & Schemas

  - Dynamic Parameters:
      description: Inject dynamic query, path, and header parameters at runtime without pre-specifying them in the schema.
      category: Advanced & Extensibility
      subExamples:
        - Query Params:
            href: /examples/dynamic-query-params
        - Form Params:
            href: /examples/dynamic-form-params

  - OAuth:
      href: /examples/oauth-demo
      description: Interactive OAuth 2.0 demonstration covering implicit flow, authorization code, and token refresh.
      category: Security & Auth

  - OAuth Extensions:
      href: /examples/oauth-vendor-extension
      description: Pre-populate client IDs, client secrets, and default scopes using x-client-id and x-default-scopes vendor extensions.
      category: Security & Auth

  - Authentication (Multiple):
      href: /examples/auth
      description: Configure complex multi-layered security schemes including API Keys, Bearer JWT, and Basic Auth.
      category: Security & Auth

  - API Key as RapiDoc Attribute:
      href: /examples/api-key
      description: Declaratively set and programmatically update API keys via DOM attributes or JavaScript properties.
      category: Security & Auth

  - Embed RapiDoc In HTML:
      href: /examples/embed-rapidoc-in-html
      description: Seamlessly co-exist with existing HTML pages, headers, footers, and enterprise design systems.
      category: Advanced & Extensibility

  - JSON Object as OpenAPI Spec:
      href: /tests/json-as-spec
      description: Pass in-memory JavaScript objects directly to RapiDoc without needing an external URL or file fetch.
      category: Advanced & Extensibility

  - Define API Server Using Template:
      href: /examples/server-vars
      description: Support dynamic multi-environment server URLs using variable substitution and template parameters.
      category: OpenAPI 3.1 & Schemas

  - Callback:
      img: /assets/images/callback.png
      href: /examples/callback
      description: Document asynchronous webhooks and subscription callbacks triggered by client requests.
      category: OpenAPI 3.1 & Schemas

  - Webhook:
      img: /assets/images/webhook.png
      href: /examples/webhook
      description: OpenAPI 3.1 top-level webhook definitions for server-initiated asynchronous events.
      category: OpenAPI 3.1 & Schemas

  - Multiple DataTypes:
      href: /examples/multi-datatypes
      description: Utilize OpenAPI 3.1 multi-type declarations conforming to the latest JSON Schema specifications.
      category: OpenAPI 3.1 & Schemas

  - Schema Composition:
      description: Model polymorphic inheritance and data variations using oneOf, anyOf, and allOf schema combinations.
      category: OpenAPI 3.1 & Schemas
      subExamples:
        - ONE OF:
            href: /examples/oneof
        - ANY OF:
            href: /examples/anyof
        - ALL OF:
            href: /examples/allof
