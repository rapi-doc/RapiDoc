    rapidoc: 'Full-page developer portal & complete API reference manual'
    rapidocMini: 'Isolated inline endpoint cards for blogs, tutorials & changelogs'
  - feature: 'Navigation Sidebar'
    rapidoc: 'Included (search bar, tag grouping, operation list)'
    rapidocMini: 'None (pure endpoint content without navigation chrome)'
  - feature: 'URL Hash Routing'
    rapidoc: 'Yes (updates browser address hash via update-route)'
    rapidocMini: "Disabled (won't alter host page URL)"
  - feature: 'Interactive TRY Console'
    rapidoc: 'Yes'
    rapidocMini: 'Yes'
  - feature: 'Container Flexibility'
    rapidoc: 'Typically full viewport height or dedicated portal frame'
    rapidocMini: 'Responsive, adapts naturally to any parent <div> container'
  - feature: 'Multi-Spec Mashup'
    rapidoc: 'Single spec per instance'
    rapidocMini: 'Multiple instances with different specs on the same page'
  - feature: 'Footprint & Layout'
    rapidoc: 'Complete portal layout (focused, view, read modes)'
    rapidocMini: 'Compact, zero-iframe inline element with no external chrome'
