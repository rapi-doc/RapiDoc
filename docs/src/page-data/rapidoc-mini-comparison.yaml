comparison:
  - feature: "Best for"
    rapidoc: "A complete API reference, on its own page"
    rapidocMini: "One or a few endpoints inside a blog post, tutorial or changelog"
  - feature: "Navigation sidebar and search"
    rapidoc: "Yes"
    rapidocMini: "No"
  - feature: "URL hash routing"
    rapidoc: "Yes (update-route)"
    rapidocMini: "No: never changes the page URL"
  - feature: "Try console"
    rapidoc: "Yes"
    rapidocMini: "Yes"
  - feature: "Sizing"
    rapidoc: "Fills the height you give it, usually the viewport"
    rapidocMini: "Grows with its content inside any container"
  - feature: "Render modes"
    rapidoc: "read, view and focused"
    rapidocMini: "One: the matched operations"
