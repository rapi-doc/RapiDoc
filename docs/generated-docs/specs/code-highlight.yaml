paths:
  /code:
    get:
      summary: Syntax Highlighting in Markdown
      description: |
        Syntax Highlighting in **OPERATION DESCRIPTION**
        ```http
        POST /pet HTTP/1.1
        Host: example.org
        Content-Type: application/json; charset=utf-8
        Content-Length: 137

        {
          "status": "ok",
          "extended": true,
          "results": [
            {"value": 0, "type": "int64"},
            {"value": 1.0e+3, "type": "decimal"}
          ]
        }
        ```

    post:
      summary: Request body
      requestBody:
        description: |
          Syntax Highlighting in **REQUEST BODY**
          ```js
          function add(x, y) {
            const answer = x + y;
            return answer;
          }

          for (let i = 0; i < 10; i++){
            console.log(3, i); // prints in console
          }
          ```

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Price"
    
      responses:
        '200':
          description: Successful

components:
  schemas:
    Price:
      type: object
      properties:
        amount:
          type: integer
        currency:
          type: string