openapi: 3.0.0
info:
  title: Syntax Highlighting
  version: 1.0.0
  description: |

    RapiDoc automatically highlights code blocks in markdown descriptions. To apply syntax highlighting, wrap your code in a fenced code block with three backticks followed by the language tag:

    ````markdown
    ```js
    const greeting = "Hello, World!";
    console.log(greeting);
    ```
    ````

