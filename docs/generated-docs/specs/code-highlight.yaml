    use std::collections::HashMap;

    #[derive(Debug, Clone, PartialEq)]
    pub struct Cache<K, V> {
        store: HashMap<K, V>,
    }

    impl<K: std::hash::Hash + Eq, V> Cache<K, V> {
        pub fn new() -> Self {
            Self { store: HashMap::new() }
        }

        pub fn insert(&mut self, key: K, value: V) -> Option<V> {
