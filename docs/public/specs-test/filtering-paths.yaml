openapi: 3.0.0
info:
  title: Filtering Endpoints
  description: |
    Test case for the `filter-operations` attribute: space- or comma-separated terms. An operation is
    shown when it matches any include term (all are, without one) and no `!` term.

    ```html
      <!-- Only the operations on paths that start with /public- -->
      <rapi-doc spec-url = "..." filter-operations = "/public-*" />

      <!-- Only GET /internal-path-1, not PUT /internal-path-1 -->
      <rapi-doc spec-url = "..." filter-operations = "GET /internal-path-1" />

      <!-- Only the operations with the badge label Core -->
      <rapi-doc spec-url = "..." filter-operations = "badge:Core" />

      <!-- Leaves out the operations with the badge label Internal or admin-use-only -->
      <rapi-doc spec-url = "..." filter-operations = "!badge:Internal !badge:admin-use-only" />
    ```
paths:
  /internal-path-1:
    get:
      x-badges:
      - color: red
        label: Internal
      - color: blue
        label: Beta
    put:
      x-badges:
      - color: red
        label: Internal
      - color: green
        label: Core
  /internal-path-2:
    get:
      x-badges:
      - color: red
        label: Internal
    post:
      x-badges:
      - color: red
        label: Internal
      - color: green
        label: Core
  /public-path-1:
    get:
      summary: An Endpoint with no badge
  /public-path-2:
    get:
      x-badges:
      - color: green
        label: Preffered
  /admin-use-only-path-1:
    get:
      summary: Slow API for Admin's use only
      description: Contains a badge `admin-use-only` and `Slow` but notice that `admin-use-only` do not show up in the UI as the badge-color is set to `none`
      x-badges:
      - color: none
        label: admin-use-only
      - color: orange
        label: Slow
  /admin-use-only-path-2:
    get:
      summary: Slow API for Admin's use only
      description: Contains a badge `admin-use-only` and `Slow` but notice that `admin-use-only` do not show up in the UI as the badge-color is set to `none`
      x-badges:
      - color: none
        label: admin-use-only
      - color: orange
        label: Slow
  /no-badges-path:
    get:
      summary: Endpoint with No badges