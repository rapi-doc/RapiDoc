  '/shipments/{shipmentId}/claims':
    post:
      tags:
        - Shipment Management
      summary: Create a lost shipment claim
      description: >-
        Submit a claim for a lost or damaged shipment. This endpoint accepts
        multipart/form-data to allow uploading photos and other evidence files
        along with the claim details.


        ### Supported File Types

        - Images: JPEG, PNG, GIF, WebP (max 10MB each)

        - Documents: PDF (max 25MB each)


        ### Maximum Files

        You can upload up to 10 files per claim.
      operationId: createShipmentClaim
      parameters:
        - name: shipmentId
          in: path
          required: true
          description: The unique identifier of the shipment
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - claimType
                - description
                - claimantEmail
              properties:
                claimType:
                  type: string
                  enum:
                    - LOST
                    - DAMAGED
                    - DELAYED
                    - MISSING_CONTENTS
                  description: The type of claim being filed
                description:
                  type: string
                  minLength: 20
                  maxLength: 5000
                  description: Detailed description of the issue and circumstances
                claimantEmail:
                  type: string
                  format: email
                  description: Email address for claim correspondence
                claimantPhone:
                  type: string
                  pattern: '^\+[1-9]\d{1,14}$'
                  description: Phone number for claim correspondence (E.164 format)
                declaredValue:
                  type: number
                  format: float
                  minimum: 0
                  description: Declared value of the shipment contents in USD
                incidentDate:
                  type: string
                  format: date
                  description: Date when the incident was discovered
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
                  maxItems: 10
                  description: 'Photos of damaged package or contents (JPEG, PNG, GIF, WebP)'
                documents:
                  type: array
                  items:
                    type: string
                    format: binary
                  maxItems: 5
                  description: >-
                    Supporting documents such as receipts, invoices, or police
                    reports (PDF only)
            encoding:
              photos:
                contentType: 'image/jpeg, image/png, image/gif, image/webp'
              documents:
                contentType: application/pdf
      responses:
        '201':
          description: Claim created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  claimId:
                    type: string
                    format: uuid
                    description: Unique identifier for the claim
                  shipmentId:
                    type: string
                    format: uuid
                    description: The shipment this claim is associated with
                  claimNumber:
                    type: string
                    pattern: '^CLM-[A-Z0-9]{8}$'
                    description: Human-readable claim reference number
                  claimType:
                    type: string
                    enum:
                      - LOST
                      - DAMAGED
                      - DELAYED
                      - MISSING_CONTENTS
                  status:
                    type: string
                    enum:
                      - SUBMITTED
                      - UNDER_REVIEW
                      - ADDITIONAL_INFO_REQUIRED
                      - APPROVED
                      - DENIED
                      - SETTLED
                    description: Current status of the claim
                  declaredValue:
                    type: number
                    format: float
                  uploadedFiles:
                    type: array
                    items:
                      type: object
                      properties:
                        fileId:
                          type: string
                          format: uuid
                        fileName:
                          type: string
                        fileType:
                          type: string
                          enum:
                            - PHOTO
                            - DOCUMENT
                        uploadedAt:
                          type: string
                          format: date-time
                  createdAt:
                    type: string
                    format: date-time
                  estimatedResolutionDate:
                    type: string
                    format: date
                    description: Expected date for claim resolution
              example:
                claimId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                shipmentId: 123e4567-e89b-12d3-a456-426614174000
                claimNumber: CLM-XK7M9P2Q
                claimType: DAMAGED
                status: SUBMITTED
                declaredValue: 299.99
                uploadedFiles:
                  - fileId: f1e2d3c4-b5a6-7890-1234-567890abcdef
                    fileName: damaged_box.jpg
                    fileType: PHOTO
                    uploadedAt: '2025-01-15T10:30:00Z'
                  - fileId: a9b8c7d6-e5f4-3210-9876-543210fedcba
                    fileName: purchase_receipt.pdf
                    fileType: DOCUMENT
                    uploadedAt: '2025-01-15T10:30:00Z'
                createdAt: '2025-01-15T10:30:00Z'
                estimatedResolutionDate: '2025-01-29'
        '400':
          description: Invalid request - missing required fields or invalid file types
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
              example:
                error: Validation failed
                details:
                  - field: description
                    message: Description must be at least 20 characters
                  - field: 'photos[2]'
                    message: 'File type not supported. Allowed: JPEG, PNG, GIF, WebP'
        '404':
          description: Shipment not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: >-
                  Shipment with ID 123e4567-e89b-12d3-a456-426614174000 not
                  found
        '409':
          description: Claim already exists for this shipment
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  existingClaimId:
                    type: string
                    format: uuid
              example:
                error: A claim already exists for this shipment
                existingClaimId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        '413':
          description: File too large
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  maxSizeBytes:
                    type: integer
              example:
                error: File exceeds maximum allowed size
                maxSizeBytes: 26214400
