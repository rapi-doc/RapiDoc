                      - ON_HOLD
                      - HOLD_PENDING
                      - HOLD_REJECTED
                  holdLocation:
                    type: string
                    enum:
                      - LAX1 - Los Angeles Hub
                      - JFK2 - New York Hub
                      - ORD3 - Chicago Hub
                      - DFW4 - Dallas Hub
                      - SEA5 - Seattle Hub
                  holdUntil:
                    type: string
                    format: date-time
                    enum:
                      - '2025-01-15T17:00:00Z'
                      - '2025-01-16T09:00:00Z'
                      - '2025-01-17T14:00:00Z'
              example:
                status: ON_HOLD
                holdLocation: LAX1 - Los Angeles Hub
                holdUntil: '2025-01-15T17:00:00Z'
