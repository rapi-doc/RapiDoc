  /oauth/token:
    post:
      summary: Issue OAuth access token
      description: >-
        Exchange client credentials for a short-lived warp-grade access token.
        The request body must be sent as `application/x-www-form-urlencoded` per
        RFC 6749.
      operationId: issueOAuthToken
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
                - client_id
                - client_secret
              properties:
                grant_type:
                  type: string
                  enum:
                    - client_credentials
                  description: >-
                    OAuth 2.0 grant type. Only `client_credentials` is supported
                    for fleet integrations.
                client_id:
                  type: string
                  description: Identifier issued when registering your fleet integration.
                client_secret:
                  type: string
                  format: password
                  description: Secret issued alongside the client_id. Treat as sensitive.
                scope:
                  type: string
                  description: >-
                    Space-separated list of requested scopes (e.g.
                    `shipments:read shipments:write`).
            example:
              grant_type: client_credentials
              client_id: cosmo-fleet-7421
              client_secret: warp-secret-xyz
              scope: 'shipments:read shipments:write'
      responses:
        '200':
          description: Access token issued
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - token_type
                  - expires_in
                properties:
                  access_token:
                    type: string
                    description: Bearer token to send in the `Authorization` header.
                  token_type:
                    type: string
                    enum:
                      - Bearer
                  expires_in:
                    type: integer
                    description: Token lifetime in seconds.
                  scope:
                    type: string
              example:
                access_token: warp.eyJhbGciOiJIUzI1NiJ9.cargo
                token_type: Bearer
                expires_in: 3600
                scope: 'shipments:read shipments:write'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - invalid_request
                      - invalid_client
                      - invalid_grant
                      - unsupported_grant_type
                  error_description:
                    type: string
              example:
                error: invalid_client
                error_description: Unknown client_id or bad credentials.
  /health:
    get:
      summary: Health check
      description: >-
        Check if the API is up and running. This endpoint is public and requires
        no authentication.
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - healthy
                  timestamp:
                    type: string
                    format: date-time
              example:
                status: healthy
                timestamp: '2025-01-09T12:00:00Z'
  /graphql:
    post:
      tags:
        - Shipment Management
      operationId: graphqlShipmentQuery
      summary: GraphQL endpoint
      description: >-
        Query the Cosmo Cargo registry via GraphQL. Test live against the public
        Rick and Morty universe schema.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      x-graphql:
        endpoint: 'https://rickandmortyapi.com/graphql'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: GraphQL operation document
                variables:
                  type: object
                  additionalProperties: true
                operationName:
                  type:
                    - string
                    - 'null'
            examples:
              list-characters:
                summary: List characters
                value:
                  query: |-
                    query ListCharacters($page: Int) {
                      characters(page: $page) {
                        info { count pages }
                        results { id name species }
                      }
                    }
                  variables:
                    page: 1
              get-character:
                summary: Get a character
                value:
                  query: |-
                    query GetCharacter($id: ID!) {
                      character(id: $id) {
                        id
                        name
                        status
                        origin { name }
                      }
                    }
                  variables:
                    id: '1'
      responses:
        '200':
          description: GraphQL response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type:
                      - object
                      - 'null'
                    additionalProperties: true
                  errors:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                additionalProperties: true
  /version:
    get:
      summary: Get API version
      description: Get information about the current API version. This endpoint is public.
      operationId: getVersion
      security: []
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  releaseDate:
                    type: string
                    format: date
                  environment:
                    type: string
                    enum:
                      - production
                      - staging
                      - development
              example:
                version: 1.0.0
                releaseDate: '2025-01-01'
                environment: production
