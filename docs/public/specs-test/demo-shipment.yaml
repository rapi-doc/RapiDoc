    get:
      tags:
        - Documentation
      summary: Get shipping label
      description: >-
        Get the shipping label for a shipment in various formats. Supports both
        JSON and XML responses. XML format follows the EDIFACT D96A standard for
        shipping label interchange, while JSON is provided for modern API
        integrations.
      operationId: getLabel
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          schema:
            type: string
            enum:
              - PDF
              - PNG
              - ZPL
          description: Label format
        - name: Accept
          in: header
          schema:
            type: string
            enum:
              - application/json
              - application/xml
            default: application/json
          description: >-
            Response format. Use application/xml for EDI-compliant responses
            following EDIFACT D96A standard.
      responses:
        '200':
          description: Label generated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - shipmentId
                  - format
                properties:
                  id:
                    type: string
                    format: uuid
                    readOnly: true
                  shipmentId:
                    type: string
                    format: uuid
                  format:
                    type: string
                    enum:
                      - PDF
                      - PNG
                      - ZPL
                  url:
                    type: string
                    format: uri
                    readOnly: true
                  createdAt:
                    type: string
                    format: date-time
                    readOnly: true
                  expiresAt:
                    type: string
                    format: date-time
                    readOnly: true
