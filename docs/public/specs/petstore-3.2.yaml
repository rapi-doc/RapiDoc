openapi: 3.2.0
# OpenAPI 3.2: the document's own URI, the base for its relative references
$self: https://rapidocui.com/specs/petstore-3.2.yaml
info:
  title: Swagger Petstore - OpenAPI 3.2
  summary: The Swagger Petstore, described in OpenAPI 3.2, calling the live server.
  description: |-
    Swagger's sample Pet Store server (`petstore3.swagger.io`, API version 1.0.27), described with
    OpenAPI 3.2 instead of the 3.0.4 definition the server publishes. Paths, parameters, bodies and
    security are the same as the server's, so **Try** calls the real server; only the description
    uses the newer specification.

    What is new compared to Swagger's 3.0.4 definition:

    - **3.2**: `$self`, a `name` on the server, tags with a `summary`, a `summary`
      on responses, reusable media types under `components.mediaTypes`, XML `nodeType` in place of
      `wrapped`, and examples with `dataValue`.
    - **3.2 methods**: a `QUERY` operation (`/pet/search`) and two `additionalOperations` (`COPY`
      on `/pet/{petId}`, `PURGE` on `/store/inventory`). The live server doesn't implement them, so
      **Try** gets an error there; tags of `kind: badge` (**Beta**, **Pending implementation**) mark
      them in the reference.
    - **3.1**: `info.summary`, an SPDX `license.identifier`, JSON Schema 2020-12 schemas (`examples`
      arrays, type arrays for nullable values, `contentMediaType` for binary bodies).

    For the 3.2 tag hierarchy (`parent` and `kind`), see `petstore-with-tag-nesting-3.2.yaml`.

    The server is a shared public demo: data you add can be changed or removed by others at any time.

    Some useful links:
    - [The Pet Store repository](https://github.com/swagger-api/swagger-petstore)
    - [The source API definition for the Pet Store (3.0)](https://github.com/swagger-api/swagger-petstore/blob/master/src/main/resources/openapi.yaml)
  termsOfService: https://swagger.io/terms/
  contact:
    email: apiteam@swagger.io
  license:
    name: Apache 2.0
    identifier: Apache-2.0
  version: 1.0.27
externalDocs:
  description: Find out more about Swagger
  url: https://swagger.io
servers:
  - url: https://petstore3.swagger.io/api/v3
    name: live
    description: Swagger's public Petstore server
tags:
  - name: pet
    summary: Pets
    description: Everything about your Pets
    externalDocs:
      description: Find out more
      url: https://swagger.io
  - name: store
    summary: Store
    description: Access to Petstore orders
    externalDocs:
      description: Find out more about our store
      url: https://swagger.io
  - name: user
    summary: Users
    description: Operations about user
  # OpenAPI 3.2 tag kind: badge tags label operations instead of grouping them
  - name: beta
    summary: Beta
    description: New and open to change; the live Petstore server doesn't answer it yet.
    kind: badge
  - name: pending-implementation
    summary: Pending implementation
    description: Described here, but not implemented by the live Petstore server.
    kind: badge
paths:
  /pet:
    put:
      tags:
        - pet
      summary: Update an existing pet.
      description: Update an existing pet by Id.
      operationId: updatePet
      requestBody:
        description: Update an existent pet in the store
        content:
          application/json:
            $ref: "#/components/mediaTypes/PetJson"
          application/xml:
            $ref: "#/components/mediaTypes/PetXml"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/Pet"
        required: true
      responses:
        "200":
          summary: Updated
          description: Successful operation
          content:
            application/json:
              $ref: "#/components/mediaTypes/PetJson"
            application/xml:
              $ref: "#/components/mediaTypes/PetXml"
        "400":
          description: Invalid ID supplied
        "404":
          description: Pet not found
        "422":
          description: Validation exception
        default:
          description: Unexpected error
      security:
        - petstore_auth:
            - write:pets
            - read:pets
    post:
      tags:
        - pet
      summary: Add a new pet to the store.
      description: Add a new pet to the store.
      operationId: addPet
      requestBody:
        description: Create a new pet in the store
        content:
          application/json:
            $ref: "#/components/mediaTypes/PetJson"
          application/xml:
            $ref: "#/components/mediaTypes/PetXml"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/Pet"
        required: true
      responses:
        "200":
          summary: Added
          description: Successful operation
          content:
            application/json:
              $ref: "#/components/mediaTypes/PetJson"
            application/xml:
              $ref: "#/components/mediaTypes/PetXml"
        "400":
          description: Invalid input
        "422":
          description: Validation exception
        default:
          description: Unexpected error
      security:
        - petstore_auth:
            - write:pets
            - read:pets
  /pet/findByStatus:
    get:
      tags:
        - pet
      summary: Finds Pets by status.
      description: Multiple status values can be provided with comma separated strings.
      operationId: findPetsByStatus
      parameters:
        - name: status
          in: query
          description: Status values that need to be considered for filter
          required: true
          explode: true
          schema:
            type: string
            default: available
            enum:
              - available
              - pending
              - sold
      responses:
        "200":
          summary: Matching pets
          description: successful operation
          content:
            application/json:
              $ref: "#/components/mediaTypes/PetListJson"
            application/xml:
              $ref: "#/components/mediaTypes/PetListXml"
        "400":
          description: Invalid status value
        default:
          description: Unexpected error
      security:
        - petstore_auth:
            - write:pets
            - read:pets
  /pet/search:
    # OpenAPI 3.2: QUERY, a safe request whose criteria travel in the body
    query:
      tags:
        - pet
        - beta
      summary: Search pets.
      description: |-
        Finds pets matching every criterion in the body: a safe, repeatable request like `GET`, with
        criteria too rich for a query string. Not implemented by the live server yet.
      operationId: searchPets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: array
                  description: Any of these statuses
                  items:
                    type: string
                    enum:
                      - available
                      - pending
                      - sold
                tags:
                  type: array
                  description: All of these tags
                  items:
                    type: string
                name:
                  type: string
                  description: Part of the pet's name, case-insensitive
              examples:
                - status:
                    - available
                  tags:
                    - tag1
                  name: dog
      responses:
        "200":
          summary: Matching pets
          description: successful operation
          content:
            application/json:
              $ref: "#/components/mediaTypes/PetListJson"
        "400":
          description: Invalid search criteria
        default:
          description: Unexpected error
      security:
        - petstore_auth:
            - read:pets
  /pet/findByTags:
    get:
      tags:
        - pet
      summary: Finds Pets by tags.
      description: Multiple tags can be provided with comma separated strings. Use tag1, tag2, tag3 for testing.
      operationId: findPetsByTags
      parameters:
        - name: tags
          in: query
          description: Tags to filter by
          required: true
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          summary: Matching pets
          description: successful operation
          content:
            application/json:
              $ref: "#/components/mediaTypes/PetListJson"
            application/xml:
              $ref: "#/components/mediaTypes/PetListXml"
        "400":
          description: Invalid tag value
        default:
          description: Unexpected error
      security:
        - petstore_auth:
            - write:pets
            - read:pets
  /pet/{petId}:
    get:
      tags:
        - pet
      summary: Find pet by ID.
      description: Returns a single pet.
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          description: ID of pet to return
          required: true
          schema:
            type: integer
            format: int64
            examples:
              - 10
      responses:
        "200":
          summary: The pet
          description: successful operation
          content:
            application/json:
              $ref: "#/components/mediaTypes/PetJson"
            application/xml:
              $ref: "#/components/mediaTypes/PetXml"
        "400":
          description: Invalid ID supplied
        "404":
          description: Pet not found
        default:
          description: Unexpected error
      security:
        - api_key: []
        - petstore_auth:
            - write:pets
            - read:pets
    post:
      tags:
        - pet
      summary: Updates a pet in the store with form data.
      description: Updates a pet resource based on the form data.
      operationId: updatePetWithForm
      parameters:
        - name: petId
          in: path
          description: ID of pet that needs to be updated
          required: true
          schema:
            type: integer
            format: int64
        - name: name
          in: query
          description: Name of pet that needs to be updated
          schema:
            type: string
        - name: status
          in: query
          description: Status of pet that needs to be updated
          schema:
            type: string
      responses:
        "200":
          summary: Updated
          description: successful operation
          content:
            application/json:
              $ref: "#/components/mediaTypes/PetJson"
            application/xml:
              $ref: "#/components/mediaTypes/PetXml"
        "400":
          description: Invalid input
        default:
          description: Unexpected error
      security:
        - petstore_auth:
            - write:pets
            - read:pets
    delete:
      tags:
        - pet
      summary: Deletes a pet.
      description: Delete a pet.
      operationId: deletePet
      parameters:
        - name: api_key
          in: header
          required: false
          schema:
            type: string
        - name: petId
          in: path
          description: Pet id to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Pet deleted
        "400":
          description: Invalid pet value
        default:
          description: Unexpected error
      security:
        - petstore_auth:
            - write:pets
            - read:pets
    # OpenAPI 3.2: methods beyond the fixed ones go under additionalOperations
    additionalOperations:
      COPY:
        tags:
          - pet
          - pending-implementation
        summary: Copy a pet.
        description: Creates a new pet with this pet's category, photos and tags, and the name in the body.
        operationId: copyPet
        parameters:
          - name: petId
            in: path
            description: ID of the pet to copy
            required: true
            schema:
              type: integer
              format: int64
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - name
                properties:
                  name:
                    type: string
                    description: The new pet's name
                    examples:
                      - doggie junior
        responses:
          "201":
            summary: Copied
            description: The new pet
            content:
              application/json:
                $ref: "#/components/mediaTypes/PetJson"
          "404":
            description: Pet not found
          default:
            description: Unexpected error
        security:
          - petstore_auth:
              - write:pets
  /pet/{petId}/uploadImage:
    post:
      tags:
        - pet
      summary: Uploads an image.
      description: Upload image of the pet.
      operationId: uploadFile
      parameters:
        - name: petId
          in: path
          description: ID of pet to update
          required: true
          schema:
            type: integer
            format: int64
        - name: additionalMetadata
          in: query
          description: Additional Metadata
          required: false
          schema:
            type: string
      requestBody:
        content:
          # OpenAPI 3.1+: a raw binary body is described by its media type, not format: binary
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        "200":
          summary: Uploaded
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: No file uploaded
        "404":
          description: Pet not found
        default:
          description: Unexpected error
      security:
        - petstore_auth:
            - write:pets
            - read:pets
  /store/inventory:
    get:
      tags:
        - store
      summary: Returns pet inventories by status.
      description: Returns a map of status codes to quantities.
      operationId: getInventory
      responses:
        "200":
          summary: Quantities by status
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
              examples:
                inventory:
                  summary: Quantities by status
                  dataValue:
                    available: 12
                    pending: 3
                    sold: 41
        default:
          description: Unexpected error
      security:
        - api_key: []
    additionalOperations:
      PURGE:
        tags:
          - store
          - pending-implementation
        summary: Purge the cached inventory.
        description: Drops the cached inventory counts, so the next `GET /store/inventory` recounts them.
        operationId: purgeInventory
        responses:
          "200":
            summary: Purged
            description: When the cache was purged
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    purgedAt:
                      type: string
                      format: date-time
                      examples:
                        - "2026-11-17T09:00:00Z"
          default:
            description: Unexpected error
        security:
          - api_key: []
  /store/order:
    post:
      tags:
        - store
      summary: Place an order for a pet.
      description: Place a new order in the store.
      operationId: placeOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
            examples:
              newOrder:
                summary: Two of pet 10, shipped as placed
                dataValue:
                  id: 10
                  petId: 10
                  quantity: 2
                  shipDate: "2026-12-01T09:00:00Z"
                  status: placed
                  complete: false
          application/xml:
            schema:
              $ref: "#/components/schemas/Order"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/Order"
      responses:
        "200":
          summary: Placed
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid input
        "422":
          description: Validation exception
        default:
          description: Unexpected error
  /store/order/{orderId}:
    get:
      tags:
        - store
      summary: Find purchase order by ID.
      description: For valid response try integer IDs with value <= 5 or > 10. Other values will generate exceptions.
      operationId: getOrderById
      parameters:
        - name: orderId
          in: path
          description: ID of order that needs to be fetched
          required: true
          schema:
            type: integer
            format: int64
            examples:
              - 3
      responses:
        "200":
          summary: The order
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
            application/xml:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid ID supplied
        "404":
          description: Order not found
        default:
          description: Unexpected error
    delete:
      tags:
        - store
      summary: Delete purchase order by identifier.
      description: For valid response try integer IDs with value < 1000. Anything above 1000 or non-integers will generate API errors.
      operationId: deleteOrder
      parameters:
        - name: orderId
          in: path
          description: ID of the order that needs to be deleted
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: order deleted
        "400":
          description: Invalid ID supplied
        "404":
          description: Order not found
        default:
          description: Unexpected error
  /user:
    post:
      tags:
        - user
      summary: Create user.
      description: This can only be done by the logged in user.
      operationId: createUser
      requestBody:
        description: Created user object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
          application/xml:
            schema:
              $ref: "#/components/schemas/User"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          summary: Created
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
        default:
          description: Unexpected error
  /user/createWithList:
    post:
      tags:
        - user
      summary: Creates list of users with given input array.
      description: Creates list of users with given input array.
      operationId: createUsersWithListInput
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/User"
      responses:
        "200":
          summary: Created
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
        default:
          description: Unexpected error
  /user/login:
    get:
      tags:
        - user
      summary: Logs user into the system.
      description: Log into the system.
      operationId: loginUser
      parameters:
        - name: username
          in: query
          description: The user name for login
          required: false
          schema:
            type: string
        - name: password
          in: query
          description: The password for login in clear text
          required: false
          schema:
            type: string
      responses:
        "200":
          summary: Signed in
          description: successful operation
          headers:
            X-Rate-Limit:
              description: calls per hour allowed by the user
              schema:
                type: integer
                format: int32
            X-Expires-After:
              description: date in UTC when token expires
              schema:
                type: string
                format: date-time
          content:
            application/xml:
              schema:
                type: string
            application/json:
              schema:
                type: string
        "400":
          description: Invalid username/password supplied
        default:
          description: Unexpected error
  /user/logout:
    get:
      tags:
        - user
      summary: Logs out current logged in user session.
      description: Log user out of the system.
      operationId: logoutUser
      responses:
        "200":
          summary: Signed out
          description: successful operation
        default:
          description: Unexpected error
  /user/{username}:
    get:
      tags:
        - user
      summary: Get user by user name.
      description: Get user detail based on username.
      operationId: getUserByName
      parameters:
        - name: username
          in: path
          description: The name that needs to be fetched. Use user1 for testing
          required: true
          schema:
            type: string
            examples:
              - user1
      responses:
        "200":
          summary: The user
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid username supplied
        "404":
          description: User not found
        default:
          description: Unexpected error
    put:
      tags:
        - user
      summary: Update user resource.
      description: This can only be done by the logged in user.
      operationId: updateUser
      parameters:
        - name: username
          in: path
          description: name that need to be deleted
          required: true
          schema:
            type: string
      requestBody:
        description: Update an existent user in the store
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
          application/xml:
            schema:
              $ref: "#/components/schemas/User"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: successful operation
        "400":
          description: bad request
        "404":
          description: user not found
        default:
          description: Unexpected error
    delete:
      tags:
        - user
      summary: Delete user resource.
      description: This can only be done by the logged in user.
      operationId: deleteUser
      parameters:
        - name: username
          in: path
          description: The name that needs to be deleted
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User deleted
        "400":
          description: Invalid username supplied
        "404":
          description: User not found
        default:
          description: Unexpected error
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 10
        petId:
          type: integer
          format: int64
          examples:
            - 198772
        quantity:
          type: integer
          format: int32
          examples:
            - 7
        shipDate:
          # JSON Schema 2020-12: a type array instead of nullable: true
          type:
            - string
            - "null"
          format: date-time
        status:
          type: string
          description: Order Status
          examples:
            - approved
          enum:
            - placed
            - approved
            - delivered
        complete:
          type: boolean
      xml:
        name: order
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 1
        name:
          type: string
          examples:
            - Dogs
      xml:
        name: category
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 10
        username:
          type: string
          examples:
            - theUser
        firstName:
          type: string
          examples:
            - John
        lastName:
          type: string
          examples:
            - James
        email:
          type: string
          format: email
          examples:
            - john@email.com
        password:
          type: string
          writeOnly: true
          examples:
            - "12345"
        phone:
          type: string
          examples:
            - "12345"
        userStatus:
          type: integer
          description: User Status
          format: int32
          examples:
            - 1
      xml:
        name: user
    Tag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      xml:
        name: tag
    Pet:
      required:
        - name
        - photoUrls
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 10
        name:
          type: string
          examples:
            - doggie
        category:
          $ref: "#/components/schemas/Category"
        photoUrls:
          type: array
          # OpenAPI 3.2: nodeType element replaces wrapped: true
          xml:
            nodeType: element
          items:
            type: string
            xml:
              name: photoUrl
        tags:
          type: array
          xml:
            nodeType: element
          items:
            $ref: "#/components/schemas/Tag"
        status:
          type: string
          description: pet status in the store
          enum:
            - available
            - pending
            - sold
      xml:
        name: pet
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string
  # OpenAPI 3.2: Media Type Objects reused by reference across operations
  mediaTypes:
    PetJson:
      schema:
        $ref: "#/components/schemas/Pet"
    PetXml:
      schema:
        $ref: "#/components/schemas/Pet"
    PetListJson:
      schema:
        type: array
        items:
          $ref: "#/components/schemas/Pet"
    PetListXml:
      schema:
        type: array
        items:
          $ref: "#/components/schemas/Pet"
  securitySchemes:
    petstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://petstore3.swagger.io/oauth/authorize
          scopes:
            write:pets: modify pets in your account
            read:pets: read your pets
    api_key:
      type: apiKey
      name: api_key
      in: header
