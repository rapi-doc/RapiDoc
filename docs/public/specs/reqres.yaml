openapi: 3.1.0
info:
  title: Request-Response API
  version: "1.0"
  description: |-
    Demo REST APIs provided by `https://reqres.in/api/` with pagination and support for response delay.
    Every operation here answers on the live demo server without a key (writes are echoed, not saved).

    For the Try examples, one operation is **deprecated** (`PUT /users/{userId}`: use `PATCH`) and one has
    a **Beta** badge (`POST /register`), so `allow-try="!deprecated !badge:Beta"` turns Try off for both.
servers:
  - url: https://reqres.in/api/
tags:
  - name: Users
    description: List, read, create, update and delete users
  - name: Resources
    description: A list of colors, the demo's other resource
  - name: Authentication
    description: Register and log in (the demo returns a token)
paths:
  /users:
    get:
      tags:
        - Users
      summary: List of users (paginated)
      description: List of users (paginated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            examples: 
              - 1
              - 2
        - name: delay
          in: query
          description: for simulating response delay. Do not provide any value for page parameter(0 indicates no delay)
          examples:
            noDelay:
              summary: No Delay
              value: 0
            someDelay:
              summary: little delay
              value: 2
          schema:
            type: integer
            minimum: 0
            maximum: 10
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                description: Description of **User** object
                properties:
                  page:
                    description: Current Page number
                    type: integer
                  per_page:
                    description: Number of records per page
                    type: integer
                  total:
                    description: Total number of records
                    type: integer
                  total_pages:
                    type: integer
                  data:
                    type: array
                    description: List of users
                    items:
                      $ref: '#/components/schemas/user'
                  support:
                    $ref: '#/components/schemas/support'
    post:
      tags:
        - Users
      summary: Create a user
      description: Create a user
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/userInput"
      responses:
        201:
          description: User creation response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/userInput'
                  - $ref: '#/components/schemas/createUserResponse'

  /users/{userId}:
    parameters:
      - in: path
        name: userId
        schema:
          type: integer
          example: 2
        required: true
        description: Numeric ID of the user
    get:
      tags:
        - Users
      summary: Get a single user
      description: Get a Single User
      responses:
        200:
          description: Response when a user is found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/user'
                  support:
                    $ref: '#/components/schemas/support'
        404:
          description: User Not found
    put:
      tags:
        - Users
      summary: Replace a user
      description: Replaces the user's name and job. Deprecated in this demo spec in favor of `PATCH`, which changes only the fields sent.
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/userInput"
            example:
              name: morpheus
              job: zion resident
      responses:
        200:
          description: The user as replaced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/userInput'
                  - $ref: '#/components/schemas/updateUserResponse'
    patch:
      tags:
        - Users
      summary: Update a user
      description: Changes only the fields sent.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/userInput"
            example:
              job: zion resident
      responses:
        200:
          description: The fields as updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/userInput'
                  - $ref: '#/components/schemas/updateUserResponse'
    delete:
      tags:
        - Users
      summary: Delete a user
      description: Deletes the user (the demo answers without deleting anything).
      responses:
        204:
          description: Deleted

  /unknown:
    get:
      tags:
        - Resources
      summary: List resources (colors)
      description: The demo's other resource, a paginated list of colors.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            examples:
              - 1
              - 2
      responses:
        200:
          description: A page of colors
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total:
                    type: integer
                  total_pages:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/resource'
                  support:
                    $ref: '#/components/schemas/support'

  /unknown/{resourceId}:
    get:
      tags:
        - Resources
      summary: Get a single resource
      parameters:
        - in: path
          name: resourceId
          schema:
            type: integer
            example: 2
          required: true
          description: Numeric ID of the color
      responses:
        200:
          description: The color
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/resource'
                  support:
                    $ref: '#/components/schemas/support'
        404:
          description: Resource not found

  /register:
    post:
      tags:
        - Authentication
      summary: Register
      description: Registers one of the demo's users (`eve.holt@reqres.in` works) and returns an id and a token.
      x-badges:
        - label: Beta
          color: orange
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/credentials"
            example:
              email: eve.holt@reqres.in
              password: pistol
      responses:
        200:
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  token:
                    type: string
        400:
          description: Missing email or password

  /login:
    post:
      tags:
        - Authentication
      summary: Log in
      description: Logs in one of the demo's users (`eve.holt@reqres.in` works) and returns a token.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/credentials"
            example:
              email: eve.holt@reqres.in
              password: cityslicka
      responses:
        200:
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        400:
          description: Missing email or password

components:
  schemas:
    user:
      type: object
      properties:
        id:
          description: User ID
          type: integer
        email:
          description: User Email
          type: string
        first_name:
          description: First Name
          type: string
        last_name:
          description: Last Name
          type: string
        avatar:
          description: Avatar URL
          type: string
    support:
      type: object
      properties:
        url:
          description: Support URL
          type: string
        text:
          description: Support URL - Description
          type: string
    userInput:
      type: object
      description: user object with `name` and `job` properties
      properties:
        name:
          description: User Name
          type: string
        job:
          description: Job
          type: string
    updateUserResponse:
      type: object
      properties:
        updatedAt:
          type: string
          format: date-time
    resource:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          examples:
            - fuchsia rose
        year:
          type: integer
        color:
          type: string
          description: Hex color
          examples:
            - "#C74375"
        pantone_value:
          type: string
    credentials:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    createUserResponse:
      type: object
      properties:
        id:
          type: integer
        createdAt:
          type: string

