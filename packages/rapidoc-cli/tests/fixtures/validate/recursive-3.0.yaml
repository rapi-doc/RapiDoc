openapi: 3.0.3
info:
  title: Recursive schema
  version: 1.0.0
paths:
  /tree:
    get:
      operationId: getTree
      summary: Get the tree
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
components:
  schemas:
    Node:
      type: object
      properties:
        children:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        weight:
          type: 12
