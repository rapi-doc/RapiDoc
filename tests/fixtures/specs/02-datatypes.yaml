openapi: 3.1.0
info:
  title: Datatypes and Constraints Test API
  version: 1.0.0
  description: Validates primitive types, format chips, numeric/string/array constraints, required/deprecated fields, and markdown tables.
paths:
  /records:
    post:
      summary: Create record with diverse parameters and constraints
      description: |
        Endpoint testing parameter constraints, deprecated status, and markdown table formatting in descriptions.

        ### Parameter Overview Table
        | Type | Field | Description |
        | :--- | :--- | :--- |
        | Query | `filterId` | Target UUID filter |
        | Query | `limit` | Result size |
      parameters:
        - name: filterId
          in: query
          required: true
          description: |
            UUID filter parameter with format validation.
            | Status | Meaning |
            | :--- | :--- |
            | 0 | Inactive |
            | 1 | Active |
          schema:
            type: string
            format: uuid
            example: 123e4567-e89b-12d3-a456-426614174000
        - name: limit
          in: query
          required: false
          description: Numeric limit with minimum and maximum constraints.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            multipleOf: 5
            default: 25
        - name: legacyCode
          in: query
          deprecated: true
          description: Deprecated query parameter to test strike-through and badge.
          schema:
            type: string
            minLength: 3
            maxLength: 10
            pattern: '^[A-Z0-9]+$'
        - name: tags
          in: query
          description: Array parameter with item constraints.
          schema:
            type: array
            minItems: 1
            maxItems: 5
            uniqueItems: true
            items:
              type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accountEmail
                - score
              properties:
                accountEmail:
                  type: string
                  format: email
                  description: Required email property.
                score:
                  type: number
                  minimum: 0.0
                  maximum: 100.0
                  exclusiveMaximum: 100.0
                  description: Floating point rating.
                website:
                  type: string
                  format: uri
                  description: Optional homepage URL.
                ipAddress:
                  type: string
                  format: ipv4
                  description: Client IP address.
                isVerified:
                  type: boolean
                  default: false
                oldStatus:
                  type: string
                  deprecated: true
                  description: Legacy property marked deprecated.
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  created:
                    type: string
                    format: date-time
